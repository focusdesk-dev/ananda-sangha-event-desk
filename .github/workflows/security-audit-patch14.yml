name: SECURITY AUDIT – Quarantined Patch14 – NO EXECUTION
on:
  push:
    branches: [security-audit-blocked-patch14-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  defender-static-scan:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA256: d32b0fff960bde730bbd5c64bf7c6bb8f052dbf80462ab9b9de49293225a9075
    steps:
      - uses: actions/checkout@v4
      - name: Download original Patch14 release without running it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path security-test | Out-Null
          gh release download ananda-beta-5.81.8-family-edit-patch14 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir security-test
          if ($LASTEXITCODE -ne 0) { throw 'Download failed. Cannot audit.' }
          $exe=(Get-ChildItem 'security-test' -Filter '*.exe' | Select-Object -First 1).FullName
          if (!$exe) { throw 'Release artifact missing' }
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SOURCE_EXACT_SHA256=$sha"
          if ($sha -ne $env:EXPECTED_SHA256) { throw 'Binary changed from flagged Patch14 release; refusing audit' }
          "AUDIT_PATCH_FILE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PASS exactly reported Patch14 release SHA (do not execute)"
      - name: Verify whether Windows exe is digitally signed
        shell: pwsh
        run: |
          $sig=Get-AuthenticodeSignature -FilePath $env:AUDIT_PATCH_FILE
          Write-Host 'AUTHENTICODE_STATUS:' $sig.Status
          Write-Host 'AUTHENTICODE_STATUS_MESSAGE:' $sig.StatusMessage
          Write-Host 'AUTHENTICODE_SIGNER:' $(if($sig.SignerCertificate){$sig.SignerCertificate.Subject}else{'NONE'})
          if($sig.Status -ne 'Valid'){Write-Host 'RESULT: Installer is not proven trustworthy by code signing.'}
      - name: Check Microsoft Defender health and definitions
        shell: pwsh
        run: |
          try {
            $s=Get-MpComputerStatus -ErrorAction Stop
            $fields=$s | Select-Object AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,AMRunningMode,AntivirusSignatureVersion,AntivirusSignatureLastUpdated
            Write-Host 'DEFENDER_STATUS' ($fields|ConvertTo-Json -Compress)
          } catch { Write-Host 'DEFENDER_NOT_AVAILABLE:' $_.Exception.Message }
          try {
            Update-MpSignature -ErrorAction Stop
            Write-Host 'DEFENDER_SIGNATURE_UPDATE: SUCCESS'
          } catch {Write-Host 'DEFENDER_SIGNATURE_UPDATE: FAILED:' $_.Exception.Message}
      - name: Scan exact binary with Microsoft Defender without executing it
        shell: pwsh
        run: |
          $scanReady=$false
          try {
            $status=Get-MpComputerStatus -ErrorAction Stop
            $scanReady=[bool]$status.AntivirusEnabled
            Write-Host 'DEFENDER_ANTIVIRUS_ENABLED:' $scanReady
          } catch {
            Write-Host 'DEFENDER_UNAVAILABLE:' $_.Exception.Message
          }
          if(!$scanReady){
            Write-Host 'SECURITY_VERDICT: INDETERMINATE — Defender scanner unavailable on GitHub runner.'
            throw 'Microsoft Defender malware scan unavailable; unsafe to declare clean.'
          }
          try {
            Write-Host 'Starting full custom-file scan (not executing the file)'
            Start-MpScan -ScanType CustomScan -ScanPath $env:AUDIT_PATCH_FILE -ErrorAction Stop
            Write-Host 'DEFENDER_CUSTOM_SCAN_COMMAND: COMPLETE'
          } catch {
            Write-Host 'DEFENDER_SCAN_EXCEPTION:' $_.Exception.ToString()
          }
          $matches=@()
          try {
            $detections=@(Get-MpThreatDetection -ErrorAction Stop)
            $matches=@($detections | Where-Object {
              ($_.Resources -join ',') -match 'Ananda-5\.81\.8-Family-Edit-Patch14' -or
              ($_.Resources -join ',') -match 'security-test'
            })
            foreach($det in $matches){
              Write-Host 'DETECTION ThreatID:' $det.ThreatID
              Write-Host 'DETECTION ThreatStatusID:' $det.ThreatStatusID
              Write-Host 'DETECTION ActionSuccess:' $det.ActionSuccess
              Write-Host 'DETECTION Resources:' ($det.Resources -join '; ')
            }
            if($matches.Count -gt 0){
              Write-Host 'SECURITY_VERDICT: DETECTED — QUARANTINE. DO NOT DISTRIBUTE.'
              throw 'Microsoft Defender detected blocked Patch14 installer'
            }
          }catch{
            if($matches.Count -gt 0){throw}
            Write-Host 'DEFENDER_GET_DETECTIONS_EXCEPTION:' $_.Exception.Message
          }
          Write-Host 'SECURITY_VERDICT: NO DETECTION ON THIS WINDOWS RUNNER ONLY; NOT PROOF OF SAFETY.'
      - name: Summarize audit
        if: always()
        shell: pwsh
        run: |
          Write-Host 'WARNING: Windows UI source already confirms severe malware detections. Do not recommend user bypass or allow-list even if CI scan reports no detection.'
