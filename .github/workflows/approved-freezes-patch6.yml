name: Ananda 5.81.8 Frozen Designs and Volunteer Fix Patch 6
on:
  push:
    branches: [patch-5818-frozen-badge-events-6]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://mirrors.huaweicloud.com/electron-builder-binaries/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install asar and app test dependencies
        shell: pwsh
        run: |
          npm install --no-fund --no-audit @electron/asar --no-save
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Download exact released 5.81.8 installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path base -Force | Out-Null
          gh release download ananda-beta-5.81.8 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir base
          if ($LASTEXITCODE -ne 0) { throw 'Original 5.81.8 download failed' }
      - name: Install 5.81.8 to isolated test folder
        shell: pwsh
        run: |
          $old=(Get-ChildItem base -Filter '*.exe' | Select-Object -First 1).FullName
          $dest=Join-Path $env:RUNNER_TEMP 'Ananda-5818-Patch-Target'
          $p=Start-Process -FilePath $old -ArgumentList @('/S',('/D='+$dest)) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Original installer failed' }
          if (!(Test-Path (Join-Path $dest 'resources/app.asar'))) { throw 'Original app.asar missing' }
          "ANANDA_PATCH_INSTALL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install required Check-In Patch 1 before building Typography Patch 2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch1 -Force | Out-Null
          gh release download ananda-beta-5.81.8-checkin-patch1 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch1
          if ($LASTEXITCODE -ne 0) { throw 'Required Check-In Patch 1 download failed' }
          $patch=(Get-ChildItem patch1 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Required Check-In Patch 1 failed' }
      - name: Install required Typography Patch 2 before building Header Patch 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch2 -Force | Out-Null
          gh release download ananda-beta-5.81.8-typography-patch2 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch2
          if ($LASTEXITCODE -ne 0) { throw 'Required Typography Patch 2 download failed' }
          $patch=(Get-ChildItem patch2 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Required Typography Patch 2 failed' }
      - name: Apply required Header Patch 3 before building Alignment Patch 4
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch3 -Force | Out-Null
          gh release download ananda-beta-5.81.8-header-patch3 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch3
          if ($LASTEXITCODE -ne 0) { throw 'Required Header Patch 3 download failed' }
          $patch=(Get-ChildItem patch3 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Required Header Patch 3 failed' }
      - name: Apply required Alignment Patch 4 before building Patch 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch4 -Force | Out-Null
          gh release download ananda-beta-5.81.8-action-patch4 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch4
          if ($LASTEXITCODE -ne 0) { throw 'Required Alignment Patch 4 download failed' }
          $patch=(Get-ChildItem patch4 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Required Alignment Patch 4 failed' }
      - name: Install verified Fresh Patch 5 before keyboard-only patch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch5 -Force | Out-Null
          gh release download ananda-beta-5.81.8-fresh-patch5 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch5
          if ($LASTEXITCODE -ne 0) { throw 'Fresh Patch 5 release download failed' }
          $patch=(Get-ChildItem patch5 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Fresh Patch 5 installation failed' }
          $current=(Get-FileHash (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar') -Algorithm SHA256).Hash
          if ($current -ne '42B01AF5726C7B6A6AB9B91ABF1148E76ED3F69341D2CD22085A1CB2091AB0F1') { throw 'Fresh Patch5 baseline mismatch' }
      - name: Apply verified Keyboard Focus Patch 5.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path keyboard -Force | Out-Null
          gh release download ananda-beta-5.81.8-keyboard-patch5-1 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir keyboard
          if ($LASTEXITCODE -ne 0) { throw 'Keyboard Patch 5.1 release download failed' }
          $patch=(Get-ChildItem keyboard -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Keyboard Focus Patch 5.1 install failed' }
          $current=(Get-FileHash (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar') -Algorithm SHA256).Hash
          if ($current -ne 'AE4D114DF4CD429CDCB4340826472FB708C31C0AB91EE2AC1BB4B156A06F2100') { throw 'Keyboard Patch 5.1 baseline mismatch' }
      - name: Install released Volunteer Patch 5.2 to verify exact working baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch52 -Force | Out-Null
          gh release download ananda-beta-5.81.8-volunteer-patch5-2 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch52
          if ($LASTEXITCODE -ne 0) { throw 'Existing Patch 5.2 release download failed' }
          $old=(Get-ChildItem patch52 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $old -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Patch 5.2 baseline installation failed' }
          $actual=(Get-FileHash (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar') -Algorithm SHA256).Hash
          if ($actual -ne '2A925ACF5306DDE18499B96688E60D4F5783599E376FBEFC5FED291C1AE68CE0') { throw 'Unexpected Patch 5.2 baseline' }
      - name: Install verified Volunteer Patch 5.3 baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch53 -Force | Out-Null
          gh release download ananda-beta-5.81.8-volunteer-fix-patch5-3 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch53
          if ($LASTEXITCODE -ne 0) { throw 'Patch 5.3 baseline download failed' }
          $patch=(Get-ChildItem patch53 -Filter '*.exe' | Select-Object -First 1).FullName
          $argsPatch=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $argsPatch -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Patch 5.3 baseline install failed' }
          $actual=(Get-FileHash (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar') -Algorithm SHA256).Hash
          if ($actual -ne 'FEC945AF6352BF22BEDA9FB75CB21A28EF235AFD24D1E23D3F739993E00ED95D') { throw 'Unexpected Patch 5.3 baseline' }
      - name: Install verified cumulative Patch 5.4 baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch54 -Force | Out-Null
          gh release download ananda-beta-5.81.8-volunteer-fix-patch5-4 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch54
          if ($LASTEXITCODE -ne 0) { throw 'Verified Patch 5.4 download failed' }
          $patch=(Get-ChildItem patch54 -Filter '*.exe' | Select-Object -First 1).FullName
          $argsPatch=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $argsPatch -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Verified Patch 5.4 install failed' }
          $actual=(Get-FileHash (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar') -Algorithm SHA256).Hash
          if ($actual -ne 'C70E85DE8F35621EF91BD51FE40D1329F3BAEADDA14327A3599F483AED8F075E') { throw 'Unexpected Patch5.4 source archive' }
      - name: Source syntax verification before building
        shell: pwsh
        run: |
          node --check scripts/approved-frozen-event-badge-patch6.js
          if ($LASTEXITCODE -ne 0) { throw 'Approved Freeze 6 JavaScript syntax is invalid' }
          node --check scripts/verify-approved-freezes-patch6-desktop.js
          if ($LASTEXITCODE -ne 0) { throw 'Patch 6 verification script syntax invalid' }
      - name: Repack exact Patch 5.4 with both approved frozen designs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path distpatch -Force | Out-Null
          node scripts/build-approved-freezes-patch6.js (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar') (Join-Path $PWD 'distpatch/app.asar') (Join-Path $env:RUNNER_TEMP 'AnandaPatchExtract')
          if ($LASTEXITCODE -ne 0) { throw 'Patch baseline or ASAR verification failed' }
      - name: Compile small Windows EXE with embedded compressed patch
        shell: pwsh
        run: |
          $meta=Get-Content frozen-patch6-hashes.json -Raw | ConvertFrom-Json
          $cs=[IO.File]::ReadAllText('scripts/AnandaApprovedFreezesPatch6.cs').Replace('__BASE_SHA__',[string]$meta.baseSha256).Replace('__PATCH_SHA__',[string]$meta.patchSha256)
          $csPath=Join-Path $PWD 'distpatch/AnandaCheckinPatch.generated.cs'
          [IO.File]::WriteAllText($csPath,$cs,[System.Text.Encoding]::UTF8)
          node -e "const fs=require('fs'),z=require('zlib');fs.writeFileSync('distpatch/app.asar.gz',z.gzipSync(fs.readFileSync('distpatch/app.asar'),{level:9}))"
          if ($LASTEXITCODE -ne 0) { throw 'Compression failed' }
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (!(Test-Path $csc)) { throw 'Windows C# compiler unavailable' }
          $out=Join-Path $PWD 'distpatch/Ananda-5.81.8-Approved-Frozen-Designs-Patch6.exe'
          $res=(Join-Path $PWD 'distpatch/app.asar.gz')+',AnandaPatchArchive'
          & $csc '/nologo' '/target:winexe' ("/out:"+$out) ("/resource:"+$res) '/reference:System.Core.dll' '/reference:System.Windows.Forms.dll' '/reference:System.IO.Compression.dll' $csPath
          if ($LASTEXITCODE -ne 0) { throw 'Patch compiler failed' }
          if (!(Test-Path $out)) { throw 'Patch exe not found' }
          Write-Host 'SMALL PATCH EXE BYTES:' (Get-Item $out).Length
      - name: Test patch applies safely to genuine installed 5.81.8
        shell: pwsh
        run: |
          $target=Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar'
          $meta=Get-Content frozen-patch6-hashes.json -Raw | ConvertFrom-Json
          if ((Get-FileHash $target -Algorithm SHA256).Hash -ne [string]$meta.baseSha256) { throw 'Original archive checksum mismatch' }
          $data=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'ANANDA SANGHA EVENT DESK/Data'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $sentinel=Join-Path $data 'patch-sentinel.txt'
          [IO.File]::WriteAllText($sentinel,'original data')
          # Simulate the user's real-world workflow: a Desktop shortcut to a
          # nonstandard/custom-installed Ananda path. No folder picker/--target.
          $shortcutPath=Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Ananda Sangha Event Desk - Patch6 QA.lnk'
          $shell=New-Object -ComObject WScript.Shell
          $shortcut=$shell.CreateShortcut($shortcutPath)
          $shortcut.TargetPath=(Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'Ananda Sangha Event Desk.exe')
          $shortcut.WorkingDirectory=$env:ANANDA_PATCH_INSTALL_DIR
          $shortcut.Save()
          $exe=(Resolve-Path 'distpatch/Ananda-5.81.8-Approved-Frozen-Designs-Patch6.exe').Path
          $argsPatch=@('--quiet')
          $p=Start-Process -FilePath $exe -ArgumentList $argsPatch -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'EXE patch installation failed' }
          if ((Get-FileHash $target -Algorithm SHA256).Hash -ne [string]$meta.patchSha256) { throw 'Patched archive checksum mismatch' }
          if (!(Get-ChildItem (Split-Path $target) -Filter 'app.asar.backup-approved-freezes-patch6-*')) { throw 'Missing original backup' }
          if ([IO.File]::ReadAllText($sentinel) -ne 'original data') { throw 'Offline data changed' }
          $p2=Start-Process -FilePath $exe -ArgumentList $argsPatch -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw 'Applying patch twice failed' }
          $verify=Start-Process -FilePath $exe -ArgumentList @('--quiet','--verify') -Wait -PassThru
          if ($verify.ExitCode -ne 0) { throw 'One-click patch failed independent verify' }
          Write-Host 'PASS one-click auto-detection via Desktop shortcut without --target, exact hash, backup and repeat'
      - name: Test packaged app real four-column Check-In and Undo UI
        shell: pwsh
        run: |
          $app=Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'Ananda Sangha Event Desk.exe'
          $p=Start-Process -FilePath $app -ArgumentList '--remote-debugging-port=9223' -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Patched app failed to start: $($p.ExitCode)" }
          node scripts/verify-approved-freezes-patch6-desktop.js
          if ($LASTEXITCODE -ne 0) { throw 'New approved designs 10+ verification checks failed' }
          node scripts/verify-checkin-patch-ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Four-column/green Checked-In/Undo/overflow test failed' }
          node scripts/verify-approved-patch5-ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Patch5 three approved screens and safe attendance provenance failed' }
          node scripts/verify-three-frozen-screens-desktop-5817.js
          if ($LASTEXITCODE -ne 0) { throw 'Existing frozen event tests failed' }
          node scripts/verify-volunteer-cross-event-desktop.js
          if ($LASTEXITCODE -ne 0) { throw 'Cross-event 2026/2027 volunteer save regression failed' }
          node scripts/verify-keyboard-focus-handler.js
          if ($LASTEXITCODE -ne 0) { throw 'Keyboard foreground guard behavior test failed' }
          node scripts/verify-beta563-keyboard.js
          if ($LASTEXITCODE -ne 0) { throw 'Keyboard typing recovery test failed' }
          node scripts/verify-beta569-typing-navigation.js
          if ($LASTEXITCODE -ne 0) { throw '100-cycle navigation typing regression failed' }
          Write-Host 'PASS patched Windows check-in and frozen screens'
      - name: Upload small patch and test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-5818-Approved-Freezes-Patch6-Verification
          path: |
            distpatch/Ananda-5.81.8-Approved-Frozen-Designs-Patch6.exe
            checkin-patch-test.png
            patch5-volunteers-test.png
            frozen-patch6-hashes.json
          if-no-files-found: warn
      - name: Release EXE patch after all tests pass
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ananda-beta-5.81.8-approved-freezes-patch6
          name: Ananda 5.81.8 Approved Frozen Designs Patch 6
          prerelease: true
          files: distpatch/Ananda-5.81.8-Approved-Frozen-Designs-Patch6.exe
          body: "Patch 6 implements two approved frozen screens, permanent person-level badge status restricted to registered volunteers per event, correct counters, print/exports, event tabs and tables, cross-event volunteer registration; with 10+ independent Windows checks and existing regression tests. Preserves frozen sidebar and Classes; closes Ananda before one-click patching. Unsigned."
