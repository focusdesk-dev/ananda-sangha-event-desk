name: Patch14 Standard Windows Installer with Malware Gates
on:
  push:
    branches: [patch14-standard-nsis-windows-installer-20261116]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Electron app build dependencies
        shell: pwsh
        run: |
          npm install --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          npm install --no-save --no-fund --no-audit @electron/asar
          if ($LASTEXITCODE -ne 0) { throw 'Archive helper setup failed' }
          node --check scripts/approved-existing-family-edit-patch14.js
          if ($LASTEXITCODE -ne 0) { throw 'Patch14 source invalid' }
          node --check scripts/verify-patch14-existing-family-desktop.js
          if ($LASTEXITCODE -ne 0) { throw 'Patch14 Windows test invalid' }
      - name: Recover exact published Patch13 code, never execute prior custom patcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path prior,build-input -Force | Out-Null
          gh release download ananda-beta-5.81.8-student-volunteer-mobile-patch13 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir prior
          if ($LASTEXITCODE -ne 0) { throw 'Released Patch13 download failed' }
          $archiveExe=(Get-ChildItem prior -Filter '*.exe' | Select-Object -First 1).FullName
          $sha=(Get-FileHash $archiveExe -Algorithm SHA256).Hash
          Write-Host 'PATCH13_CONTAINER_SHA256:' $sha
          $asm=[Reflection.Assembly]::LoadFrom($archiveExe)
          $res=$asm.GetManifestResourceStream('AnandaPatchArchive')
          if (!$res) { throw 'Released Patch13 archive resource missing' }
          $gzip=[IO.Compression.GZipStream]::new($res,[IO.Compression.CompressionMode]::Decompress)
          $stream=[IO.File]::Create((Join-Path $PWD 'build-input/app.asar'))
          try { $gzip.CopyTo($stream) } finally { $stream.Close();$gzip.Close();$res.Close() }
          $sha=(Get-FileHash 'build-input/app.asar' -Algorithm SHA256).Hash
          if ($sha -ne '70F3424BEBCC9434D9D54B678EC69677A50C21A30BD7A0FFDC69EB4EE11BFC7F') { throw 'Released Patch13 runtime mismatch' }
          Write-Host 'PASS exact verified Patch13 app.asar code'
      - name: Apply only reviewed Patch14 family edit to released source
        shell: pwsh
        run: |
          node scripts/prepare-patch14-standard-installer.js build-input/app.asar
          if ($LASTEXITCODE -ne 0) { throw 'Strict source preservation failed' }
      - name: Compile conventional full NSIS installer using official electron-builder
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Standard Electron installer creation failed' }
          $app=Join-Path $PWD 'dist/win-unpacked/Ananda Sangha Event Desk.exe'
          if (!(Test-Path $app)) { throw 'Packaged Windows desktop application missing' }
          $setup=Get-ChildItem dist -Filter '*.exe' -File | Where-Object { $_.FullName -notlike '*win-unpacked*' } | Select-Object -First 1
          if (!$setup) { throw 'Conventional NSIS Setup exe missing' }
          $newName='Ananda-Sangha-Event-Desk-Patch14-Standard-Setup.exe'
          Move-Item $setup.FullName (Join-Path $PWD ('dist/'+$newName))
          $setup=Join-Path $PWD ('dist/'+$newName)
          Write-Host 'STANDARD_INSTALLER:' $setup
          Write-Host 'STANDARD_SHA256:' (Get-FileHash $setup -Algorithm SHA256).Hash
          Write-Host 'SIGNATURE:' (Get-AuthenticodeSignature -FilePath $setup).Status
          "NSIS_SETUP_FILE=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compare installed payload with reviewed Patch13 plus Patch14 source
        shell: pwsh
        run: |
          $archive=Join-Path $PWD 'dist/win-unpacked/resources/app.asar'
          $meta=Get-Content standard-patch14-source-integrity.json -Raw | ConvertFrom-Json
          node -e "const asar=require('@electron/asar');const fs=require('fs');const crypto=require('crypto');const x=asar.extractFile('dist/win-unpacked/resources/app.asar','index.html');const h=crypto.createHash('sha256').update(x).digest('hex').toUpperCase();const j=JSON.parse(fs.readFileSync('standard-patch14-source-integrity.json'));console.log('INSTALLED_INDEX_SHA:',h);if(h!==j.newIndexSha256)process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged app differs from reviewed source' }
          $runtime=(Get-FileHash 'dist/win-unpacked/resources/app.asar' -Algorithm SHA256).Hash
          Write-Host 'PASS exact reviewed app in conventional installer. ASAR SHA256:' $runtime
      - name: Run Patch14 Windows UI and prior critical regressions against actual desktop app
        shell: pwsh
        run: |
          $app=Join-Path $PWD 'dist/win-unpacked/Ananda Sangha Event Desk.exe'
          $p=Start-Process -FilePath $app -ArgumentList '--remote-debugging-port=9223' -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { throw 'Packaged Ananda application failed to launch' }
          node scripts/verify-patch14-existing-family-desktop.js
          if ($LASTEXITCODE -ne 0) { throw 'Existing-family edit, add and check-in regression' }
          node scripts/verify-patch13-student-volunteer-and-mobile-desktop.js
          if ($LASTEXITCODE -ne 0) { throw 'Student Progress/mobile duplicate regression' }
          node scripts/verify-patch12-register-under-desktop.js
          if ($LASTEXITCODE -ne 0) { throw 'New Registration family regression' }
          node scripts/verify-prior-freezes-patch11-desktop.js
          if ($LASTEXITCODE -ne 0) { throw 'Previously frozen event UI regression' }
          node scripts/verify-volunteer-cross-event-desktop.js
          if ($LASTEXITCODE -ne 0) { throw 'Volunteer cross-year regression' }
          Write-Host 'PASS all Patch14 and prior verified Windows app tests'
      - name: Scan finished conventional setup with Microsoft Defender
        shell: pwsh
        run: |
          $setup=$env:NSIS_SETUP_FILE
          $state=Get-MpComputerStatus -ErrorAction Stop
          if (!$state.AntivirusEnabled) { throw 'Defender scanner disabled; no release permitted' }
          try { Update-MpSignature -ErrorAction Stop } catch { Write-Host 'Signature update unsuccessful; using existing definitions:' $_.Exception.Message }
          $state=Get-MpComputerStatus
          Write-Host 'Defender definitions:' $state.AntivirusSignatureVersion
          Start-MpScan -ScanType CustomScan -ScanPath $setup -ErrorAction Stop
          $dets=@(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
            ($_.Resources -join ';') -match 'Ananda-Sangha-Event-Desk-Patch14-Standard-Setup' -or
            ($_.Resources -join ';') -match 'win-unpacked'
          })
          if ($dets.Count -gt 0) {
            Write-Host 'DEFENDER_DETECTIONS:' ($dets | ConvertTo-Json -Depth 5)
            throw 'Malware detected. Do not publish new installer'
          }
          if (!(Test-Path $setup)) { throw 'Defender removed installer; malware suspected' }
          Write-Host 'PASS no Microsoft Defender detections on Windows test runner; not a guarantee for user device'
      - name: Upload conventional setup for independent ClamAV scan
        uses: actions/upload-artifact@v4
        with:
          name: ananda-patch14-standard-setup
          path: |
            dist/Ananda-Sangha-Event-Desk-Patch14-Standard-Setup.exe
            standard-patch14-source-integrity.json
            patch14-existing-family-verified.png
          if-no-files-found: error
  scan-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ananda-patch14-standard-setup
          path: audit
      - name: Install ClamAV and obtain current signatures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --verbose
          clamscan --version
      - name: Independent file scan of full installer
        run: |
          clamscan --infected --allmatch --max-filesize=300M --max-scansize=800M audit/Ananda-Sangha-Event-Desk-Patch14-Standard-Setup.exe
          echo 'PASS second antivirus engine found no infection. Not a security guarantee.'
  release:
    needs: [build-windows, scan-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ananda-patch14-standard-setup
          path: release
      - name: Publish only independently scanned conventional installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ananda-beta-5.81.8-patch14-standard-installer
          name: Ananda 5.81.8 Patch14 — Standard Windows Setup (unsigned)
          prerelease: true
          files: |
            release/Ananda-Sangha-Event-Desk-Patch14-Standard-Setup.exe
            release/standard-patch14-source-integrity.json
          body: |
            Conventional full Electron/NSIS Windows installer, instead of original flagged custom embedded-GZip patcher.
            Retains released Patch13 app with only approved Patch14 family edit script inserted.
            Windows UI regression suite and Microsoft Defender & ClamAV file scans must pass before publishing.
            IMPORTANT: This installer is UNSIGNED because this project has no trusted code-signing certificate.
            Antivirus detections on the user's device remain unresolved; never bypass/disable security or restore quarantined files.
            Upgrades existing app of the same product/appId. Personal data remains in Documents/ANANDA SANGHA EVENT DESK.
