name: Verify approved Four-Section Settings Patch14.7 (No Release Yet)
on:
  push:
    branches: [patch14-7-settings-four-sections-danger-zone-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-settings-approval:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: C05341B5BA44A79AF29122EA39FF88E97F0D8D512BF17C1B303E6612194BD43A
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up the exact approved Patch14.6 desktop app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path base,source,source/unpacked,prior,build | Out-Null
          gh release download ananda-5.81.8-patch14-1-add-member-update --repo focusdesk-dev/ananda-sangha-event-desk --pattern 'Ananda-Patch14.1-ADD-MEMBER-Update.zip' --dir source
          if($LASTEXITCODE -ne 0){throw 'Approved Patch14.1 source missing'}
          Expand-Archive source/Ananda-Patch14.1-ADD-MEMBER-Update.zip source/unpacked -Force
          if((Get-FileHash source/unpacked/app.asar -Algorithm SHA256).Hash -ne '24F788CED0E3616EDAA52A1A6566BA0B58CAD6555CE34D09A00087E525E1A4EC'){throw 'Wrong Patch14.1 code'}
          gh release download ananda-beta-5.81.8 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir base
          if($LASTEXITCODE -ne 0){throw 'Base full Windows installer missing'}
          gh release download ananda-5.81.8-patch14-6-excel-formatting-dark-borders --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir prior
          if($LASTEXITCODE -ne 0){throw 'Approved Patch14.6 updater missing'}
          $setup=(Get-ChildItem base -Filter '*.exe' |Select-Object -First 1).FullName
          $dest=Join-Path $env:RUNNER_TEMP 'AnandaApprovedSettings147'
          $p=Start-Process -FilePath $setup -ArgumentList @('/S',('/D='+$dest)) -PassThru -Wait
          if($p.ExitCode -ne 0){throw 'Full Windows base failed to install'}
          $archive=Join-Path $dest 'resources/app.asar'
          Copy-Item source/unpacked/app.asar $archive -Force
          $update=(Get-ChildItem prior -Filter '*.exe' |Select-Object -First 1).FullName
          $p=Start-Process -FilePath $update -ArgumentList @('/S',('/D='+$dest)) -PassThru
          if(!$p.WaitForExit(90000)){Stop-Process -Id $p.Id -Force;throw 'Patch14.6 install timed out'}
          if($p.ExitCode -ne 0){throw 'Patch14.6 upgrade failed'}
          if((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:BASE_SHA){throw 'Wrong Patch14.6 baseline code'}
          "ANANDA_INSTALL=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Apply scoped Settings-only code and verify original modules
        shell: pwsh
        run: |
          npm install --no-save --no-audit --no-fund @electron/asar
          if($LASTEXITCODE -ne 0){throw 'ASAR packager unavailable'}
          node --check scripts/approved-four-section-settings-patch14-7.js
          if($LASTEXITCODE -ne 0){throw 'Settings script has syntax error'}
          $original=Join-Path $env:ANANDA_INSTALL 'resources/app.asar'
          node scripts/build-four-section-settings-patch14-7.js $original build/app.asar build/unpacked
          if($LASTEXITCODE -ne 0){throw 'Settings-only source guard failed'}
          Copy-Item build/app.asar $original -Force
          $new=(Get-FileHash $original -Algorithm SHA256).Hash
          if($new -eq $env:BASE_SHA){throw 'Settings code was not applied'}
          Write-Host 'VERIFIED_SETTINGS_APP_SHA256:' $new
      - name: Verify actual Windows Settings layout and all approved functionality
        shell: pwsh
        run: |
          $exe=Join-Path $env:ANANDA_INSTALL 'Ananda Sangha Event Desk.exe'
          $p=Start-Process -FilePath $exe -ArgumentList '--remote-debugging-port=9223' -PassThru
          Start-Sleep -Seconds 7
          if($p.HasExited){throw 'Ananda Windows app failed to launch'}
          $tests=@(
            'scripts/verify-four-section-settings-patch14-7-windows.js',
            'scripts/verify-class-reports-xlsx-patch14-5-windows.js',
            'scripts/verify-direct-view-single-yellow-patch14-4-windows.js',
            'scripts/verify-beta574-reports-desktop.js',
            'scripts/verify-patch14-existing-family-desktop.js',
            'scripts/verify-patch13-student-volunteer-and-mobile-desktop.js',
            'scripts/verify-patch12-register-under-desktop.js',
            'scripts/verify-volunteer-cross-event-desktop.js'
          )
          foreach($test in $tests){
            Write-Host "RUNNING_WINDOWS_TEST: $test"
            node $test
            if($LASTEXITCODE -ne 0){throw "Regression failure in $test"}
            Write-Host "PASSED_WINDOWS_TEST: $test"
          }
          Write-Host 'PASS frozen sidebar, Settings handlers, Danger Zone, reports, registration, payments and Event workflows'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ananda-settings-patch14-7-approval-screenshot
          path: settings14-7-verification/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ananda-settings-patch14-7-source-verification
          path: patch14-7-source-audit.json
          if-no-files-found: warn
