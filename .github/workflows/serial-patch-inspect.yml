name: Inspect serial attendance patch points
on:
  push:
    branches: [patch14-11-attendance-serial-entry-20261118]
    paths: ['.github/workflows/serial-patch-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract attendance context
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          pats=[r'CLASS ATTENDANCE',r'ATTENDANCE LIST',r'Print attendance sheets',r'ALL STUDENTS',r'attendanceList',r'function .*ttendance',r'function .*ttend',r'function .*[Ss]ave.*[Aa]ttend',r'currentAttendance',r'selectedAttendance',r'classAttendance',r'ATTENDANCE BY',r'courseAttendance']
          matches=[i for i,l in enumerate(lines) if any(re.search(p,l,re.I) for p in pats)]
          out=['LINE COUNT: '+str(len(lines)),'MATCHES: '+str(len(matches))]
          for i in matches[:90]:
              out.append('\n'+'='*20+' at line '+str(i+1)+' '+'='*20)
              out.extend(f'{j+1:05}: {lines[j][:350]}' for j in range(max(0,i-7),min(len(lines),i+12)))
          pathlib.Path('serial-attendance-inspection.txt').write_text('\n'.join(out)[:90000],encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name "Ananda Patch Builder"
          git config user.email "actions@users.noreply.github.com"
          git add serial-attendance-inspection.txt
          git commit -m "Inspection only: attendance implementation points"
          git push
