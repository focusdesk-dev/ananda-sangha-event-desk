name: Inspect serial attendance integration
on:
  push:
    branches: [patch14-11-attendance-serial-entry-20261118]
    paths: ['.github/workflows/serial-patch-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract targeted attendance context
        run: |
          python3 - <<'PY'
          import re,pathlib
          lines=pathlib.Path('index.html').read_text(encoding='utf-8').splitlines()
          pats=['classAttendanceHub','p2v510Attendance','attendanceList','attendanceRows','renderClassAttendance','renderAttendance','markClassAttendance','classAttendanceDate','attendanceByClass','p2v5Attendance','studentAttendance','attendanceStatus','function saveAttendance']
          matches=[i for i,l in enumerate(lines) if i>300 and any(p.lower() in l.lower() for p in pats)]
          spans=set()
          for i in matches:
              for j in range(max(0,i-2),min(len(lines),i+4)):spans.add(j)
          out=['ALL MATCHES='+str(len(matches))]
          for j in sorted(spans):
              if len(lines[j])>500: out.append(f'{j+1:05d}: '+lines[j][:500])
              else: out.append(f'{j+1:05d}: '+lines[j])
          pathlib.Path('serial-attendance-inspection.txt').write_text('\n'.join(out)[:170000])
          PY
      - name: Commit inspection
        run: |
          git config user.name "Ananda Patch Builder"
          git config user.email "actions@users.noreply.github.com"
          git add serial-attendance-inspection.txt
          git commit -m "Targeted inspection for serial attendance patch"
          git push
