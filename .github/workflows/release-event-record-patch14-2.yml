name: Ananda Patch14.2 Event Record Windows installer - verified
on:
  push:
    branches: [release-event-record-patch14-2-20261117]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-validate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 24F788CED0E3616EDAA52A1A6566BA0B58CAD6555CE34D09A00087E525E1A4EC
      NEW_SHA: 4A4AA270D6ED61E2A5D586B46F576C7593E699988AEE0F72032202DE4D571689
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve exact released Patch14.1 application archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path source,source/unpacked,build,dist-patch14-2,windows-base | Out-Null
          gh release download ananda-5.81.8-patch14-1-add-member-update --repo focusdesk-dev/ananda-sangha-event-desk --pattern 'Ananda-Patch14.1-ADD-MEMBER-Update.zip' --dir source
          if($LASTEXITCODE -ne 0){throw 'Released Patch14.1 not available'}
          Expand-Archive -LiteralPath source/Ananda-Patch14.1-ADD-MEMBER-Update.zip -DestinationPath source/unpacked -Force
          if((Get-FileHash source/unpacked/app.asar -Algorithm SHA256).Hash -ne $env:BASE_SHA){throw 'Wrong Patch14.1 app source'}
      - name: Build exact scoped Patch14.2 code and verify frozen application files
        shell: pwsh
        run: |
          npm install --no-save --no-fund --no-audit @electron/asar
          if($LASTEXITCODE -ne 0){throw 'ASAR builder unavailable'}
          node scripts/verify-event-record-route-patch14-2.js
          if($LASTEXITCODE -ne 0){throw 'Route source check failed'}
          node scripts/build-event-record-route-patch14-2.js source/unpacked/app.asar build/app.asar build/extracted
          if($LASTEXITCODE -ne 0){throw 'Application source changed unexpectedly'}
          if((Get-FileHash build/app.asar -Algorithm SHA256).Hash -ne $env:NEW_SHA){throw 'New application archive hash mismatch'}
          Copy-Item build/app.asar source/app.asar
      - name: Build conventional standard NSIS updater
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if($LASTEXITCODE -ne 0){throw 'NSIS failed to install'}
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          Copy-Item build/app.asar payload/app.asar
          & 'C:\Program Files (x86)\NSIS\makensis.exe' '/V4' 'Patch14-2-Standard-Update.nsi'
          if($LASTEXITCODE -ne 0){throw 'NSIS build failed'}
          $exe='dist-patch14-2/Ananda-Patch14.2-EVENT-RECORD-Installer.exe'
          if(!(Test-Path $exe)){throw 'Updater missing'}
          Write-Host 'UPDATER_SHA256:' (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host 'UPDATER_SIZE:' (Get-Item $exe).Length
          Write-Host 'AUTHENTICODE_SIGNATURE:' (Get-AuthenticodeSignature $exe).Status
      - name: Build Windows baseline with actual Patch14.1 code and saved data
        shell: pwsh
        run: |
          gh release download ananda-beta-5.81.8 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir windows-base
          if($LASTEXITCODE -ne 0){throw 'Full baseline installer unavailable'}
          $setup=(Get-ChildItem windows-base -Filter '*.exe'|Select-Object -First 1).FullName
          $dest=Join-Path $env:RUNNER_TEMP 'AnandaPatch142VerifiedUpgrade'
          $p=Start-Process -FilePath $setup -ArgumentList @('/S',('/D='+$dest)) -PassThru -Wait
          if($p.ExitCode -ne 0){throw 'Failed to install Windows baseline'}
          $archive=Join-Path $dest 'resources/app.asar'
          Copy-Item source/unpacked/app.asar $archive -Force
          if((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:BASE_SHA){throw 'Baseline archive is incorrect'}
          $data=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'ANANDA SANGHA EVENT DESK/Data'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          [IO.File]::WriteAllText((Join-Path $data 'patch14-2-data-sentinel.txt'),'Preserve previously saved records')
          "ANANDA_TEST_INSTALL=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install single updater EXE and verify SHA, backup, records
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist-patch14-2/Ananda-Patch14.2-EVENT-RECORD-Installer.exe').Path
          $dest=$env:ANANDA_TEST_INSTALL
          $p=Start-Process -FilePath $exe -ArgumentList @('/S',('/D='+$dest)) -PassThru
          if(!$p.WaitForExit(90000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'Updater did not finish'}
          if($p.ExitCode -ne 0){throw 'NSIS updater failed'}
          $archive=Join-Path $dest 'resources/app.asar'
          $backup=Join-Path $dest 'resources/app.asar.before-patch14-2'
          if(!(Test-Path $backup)){throw 'Original app code was not backed up'}
          if((Get-FileHash $backup -Algorithm SHA256).Hash -ne $env:BASE_SHA){throw 'Original archive backup corrupted'}
          if((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:NEW_SHA){throw 'Installed archive is not verified Patch14.2'}
          $sentinel=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'ANANDA SANGHA EVENT DESK/Data/patch14-2-data-sentinel.txt'
          if([IO.File]::ReadAllText($sentinel) -ne 'Preserve previously saved records'){throw 'Previously saved data was altered'}
          Write-Host 'PASS actual Windows updater + code SHA + old code backup + offline Documents data preserved'
      - name: Test the installed app with current approved UI and data regression suites
        shell: pwsh
        run: |
          $app=Join-Path $env:ANANDA_TEST_INSTALL 'Ananda Sangha Event Desk.exe'
          $p=Start-Process -FilePath $app -ArgumentList '--remote-debugging-port=9223' -PassThru
          Start-Sleep -Seconds 7
          if($p.HasExited){throw 'Installed app failed to launch'}
          $tests=@(
            'scripts/verify-event-record-route-windows-patch14-2.js',
            'scripts/verify-patch14-existing-family-desktop.js',
            'scripts/verify-patch13-student-volunteer-and-mobile-desktop.js',
            'scripts/verify-patch12-register-under-desktop.js',
            'scripts/verify-volunteer-cross-event-desktop.js'
          )
          foreach($test in $tests){
            Write-Host "RUNNING_APPROVED_TEST: $test"
            node $test
            if($LASTEXITCODE -ne 0){throw "Windows installed UI regression: $test"}
            Write-Host "PASSED_APPROVED_TEST: $test"
          }
          Write-Host 'PASS all current frozen Event and attendee/volunteer regression suites on installed Windows app'
      - name: Scan exact updater EXE with Microsoft Defender
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist-patch14-2/Ananda-Patch14.2-EVENT-RECORD-Installer.exe').Path
          $state=Get-MpComputerStatus -ErrorAction Stop
          if(!$state.AntivirusEnabled){throw 'Defender unavailable'}
          try{Update-MpSignature -ErrorAction Stop}catch{Write-Host 'Definition update unavailable:' $_.Exception.Message}
          Write-Host 'DEFENDER_VERSION:' (Get-MpComputerStatus).AntivirusSignatureVersion
          Start-MpScan -ScanType CustomScan -ScanPath $exe -ErrorAction Stop
          $hits=@(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object{($_.Resources -join ';') -match 'Ananda-Patch14.2-EVENT-RECORD-Installer.exe'})
          if($hits.Count -gt 0){throw 'Microsoft Defender detected the updater'}
          if(!(Test-Path $exe)){throw 'Defender quarantined the updater'}
          Write-Host 'PASS no Microsoft Defender detection on exact EXE'
      - uses: actions/upload-artifact@v4
        with:
          name: ananda-patch14-2-event-record-updater
          path: dist-patch14-2/Ananda-Patch14.2-EVENT-RECORD-Installer.exe
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ananda-patch14-2-ui-verification
          path: |
            ui-route-artifacts/*.png
            event-record-route-build-report.json
          if-no-files-found: error
  clamav:
    needs: windows-validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ananda-patch14-2-event-record-updater
          path: audit
      - name: Install updated independent malware scanner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --verbose
          clamscan --version
      - name: Scan exact updater EXE with ClamAV
        run: |
          test -s audit/Ananda-Patch14.2-EVENT-RECORD-Installer.exe
          clamscan --infected --allmatch --max-filesize=200M --max-scansize=500M audit/Ananda-Patch14.2-EVENT-RECORD-Installer.exe
          echo 'PASS independent ClamAV scan'
  release:
    needs: [windows-validate,clamav]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ananda-patch14-2-event-record-updater
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ananda-5.81.8-patch14-2-event-record-restore
          name: Ananda Patch14.2 — Approved Event Record UI Restoration
          prerelease: true
          files: release/Ananda-Patch14.2-EVENT-RECORD-Installer.exe
          body: |
            One EXE updater for existing Windows Ananda Sangha Event Desk PATCH14.1 installation only.
            Fixes the event VIEW action to show the previously approved Event Record summary,
            rather than the obsolete JND Event Tasks workspace. Keeps all 4 event tabs and
            approved Classes, saved-family Add Member, phone duplicate and badge workflows.
            Updates only the app.asar archive. Previous archive is backed up; offline Documents data
            is never overwritten. Installation over an unknown source fails closed.
            Windows installed-app UI, saved family, registration, volunteer and data-preservation
            tests and Microsoft Defender + ClamAV scans must pass before publishing.
            UNSIGNED executable. If a browser/antivirus blocks the file, do not bypass it.
