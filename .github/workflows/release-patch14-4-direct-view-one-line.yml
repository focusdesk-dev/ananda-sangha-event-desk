name: Ananda Patch14.4 - VIEW direct and ONE yellow divider (verified EXE)
on:
  push:
    branches: [patch14-4-direct-view-single-yellow-divider-20261117]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-validate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 24F788CED0E3616EDAA52A1A6566BA0B58CAD6555CE34D09A00087E525E1A4EC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download EXACT released approved Patch14.1 app and install Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path source,source/unpacked,build,dist-patch14-4,base-installer,patch142,patch143 | Out-Null
          gh release download ananda-5.81.8-patch14-1-add-member-update --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.zip' --dir source
          if($LASTEXITCODE -ne 0){throw 'Verified Patch14.1 source missing'}
          Expand-Archive -LiteralPath source/Ananda-Patch14.1-ADD-MEMBER-Update.zip -DestinationPath source/unpacked -Force
          if((Get-FileHash source/unpacked/app.asar -Algorithm SHA256).Hash -ne $env:BASE_SHA){throw 'Wrong Patch14.1 app source'}
          gh release download ananda-beta-5.81.8 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir base-installer
          if($LASTEXITCODE -ne 0){throw 'Windows baseline installer unavailable'}
          $setup=(Get-ChildItem base-installer -Filter '*.exe' | Select-Object -First 1).FullName
          $dest=Join-Path $env:RUNNER_TEMP 'AnandaPatch144VerifiedUpgrade'
          $p=Start-Process -FilePath $setup -ArgumentList @('/S',('/D='+$dest)) -PassThru -Wait
          if($p.ExitCode -ne 0){throw 'Windows runtime installation failed'}
          $app=Join-Path $dest 'resources/app.asar'
          Copy-Item source/unpacked/app.asar $app -Force
          if((Get-FileHash $app -Algorithm SHA256).Hash -ne $env:BASE_SHA){throw 'Approved baseline archive mismatch'}
          $data=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'ANANDA SANGHA EVENT DESK/Data'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          [IO.File]::WriteAllText((Join-Path $data 'patch14-4-sentinel.txt'),'EXISTING OFFLINE DATA MUST SURVIVE')
          "ANANDA_TEST_INSTALL=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build exact one-file app correction; verify original frozen layouts remain intact
        shell: pwsh
        run: |
          npm install --no-save --no-fund --no-audit @electron/asar
          if($LASTEXITCODE -ne 0){throw 'ASAR packager unavailable'}
          node --check scripts/approved-direct-event-single-divider-patch14-4.js
          if($LASTEXITCODE -ne 0){throw 'Patch14.4 syntax error'}
          node scripts/build-direct-view-single-divider-patch14-4.js source/unpacked/app.asar build/app.asar build/extracted
          if($LASTEXITCODE -ne 0){throw 'Original app changed beyond two corrections'}
          $sha=(Get-FileHash build/app.asar -Algorithm SHA256).Hash
          "NEW_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'VERIFIED_NEW_ARCHIVE_SHA256:' $sha
      - name: Build one standard Windows EXE updater supporting verified 14.1, 14.2 and 14.3
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if($LASTEXITCODE -ne 0){throw 'NSIS unavailable'}
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          Copy-Item build/app.asar payload/app.asar
          $nsi=[IO.File]::ReadAllText((Join-Path $PWD 'Patch14-4-Standard-Update.nsi'))
          if(!$nsi.Contains('__NEW_SHA__')){throw 'Installer hash placeholder not found'}
          $nsi=$nsi.Replace('__NEW_SHA__',$env:NEW_SHA.ToLowerInvariant())
          [IO.File]::WriteAllText((Join-Path $PWD 'Patch14-4-Generated.nsi'),$nsi)
          & 'C:\Program Files (x86)\NSIS\makensis.exe' '/V4' 'Patch14-4-Generated.nsi'
          if($LASTEXITCODE -ne 0){throw 'Updater build failed'}
          $exe='dist-patch14-4/Ananda-Patch14.4-VIEW-ONE-YELLOW-LINE-Installer.exe'
          if(!(Test-Path $exe)){throw 'EXE installer missing'}
          Write-Host 'INSTALLER_SHA256:' (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host 'INSTALLER_BYTES:' (Get-Item $exe).Length
          Write-Host 'AUTHENTICODE_STATUS:' (Get-AuthenticodeSignature $exe).Status
      - name: Test one-click upgrade from the approved Patch14.1 and preserve offline data
        shell: pwsh
        run: |
          $dest=$env:ANANDA_TEST_INSTALL
          $exe=(Resolve-Path 'dist-patch14-4/Ananda-Patch14.4-VIEW-ONE-YELLOW-LINE-Installer.exe').Path
          $p=Start-Process -FilePath $exe -ArgumentList @('/S',('/D='+$dest)) -PassThru
          if(!$p.WaitForExit(90000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'EXE update timed out'}
          if($p.ExitCode -ne 0){throw 'EXE update failed'}
          $new=Join-Path $dest 'resources/app.asar'
          $old=Join-Path $dest 'resources/app.asar.before-patch14-4'
          if(!(Test-Path $old)){throw 'Original app not backed up'}
          if((Get-FileHash $old -Algorithm SHA256).Hash -ne $env:BASE_SHA){throw 'Backup corrupted'}
          if((Get-FileHash $new -Algorithm SHA256).Hash -ne $env:NEW_SHA){throw 'Updated app SHA mismatch'}
          $file=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'ANANDA SANGHA EVENT DESK/Data/patch14-4-sentinel.txt'
          if([IO.File]::ReadAllText($file) -ne 'EXISTING OFFLINE DATA MUST SURVIVE'){throw 'Existing data damaged'}
          Write-Host 'PASS real Windows EXE installation + backup + SHA + offline data preserved'
      - name: Test VIEW and single yellow line in the actual Windows app, plus frozen family and volunteer workflows
        shell: pwsh
        run: |
          $exe=Join-Path $env:ANANDA_TEST_INSTALL 'Ananda Sangha Event Desk.exe'
          $p=Start-Process -FilePath $exe -ArgumentList '--remote-debugging-port=9223' -PassThru
          Start-Sleep -Seconds 7
          if($p.HasExited){throw 'Windows app failed to launch'}
          $tests=@(
            'scripts/verify-direct-view-single-yellow-patch14-4-windows.js',
            'scripts/verify-patch14-existing-family-desktop.js',
            'scripts/verify-patch13-student-volunteer-and-mobile-desktop.js',
            'scripts/verify-patch12-register-under-desktop.js',
            'scripts/verify-volunteer-cross-event-desktop.js'
          )
          foreach($test in $tests){
            Write-Host "RUNNING_WINDOWS_TEST: $test"
            node $test
            if($LASTEXITCODE -ne 0){throw "Regression failure: $test"}
            Write-Host "PASSED_WINDOWS_TEST: $test"
          }
          Write-Host 'PASS all current approved workflows + four yellow divider positions'
      - name: Validate upgrade from the latest Patch14.3 too
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist-patch14-4/Ananda-Patch14.4-VIEW-ONE-YELLOW-LINE-Installer.exe').Path
          gh release download ananda-5.81.8-patch14-2-event-record-restore --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch142
          if($LASTEXITCODE -ne 0){throw 'Patch14.2 updater not found'}
          gh release download ananda-5.81.8-patch14-3-selected-event-heading --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch143
          if($LASTEXITCODE -ne 0){throw 'Patch14.3 updater not found'}
          $setup=(Get-ChildItem base-installer -Filter '*.exe'|Select-Object -First 1).FullName
          $dest=Join-Path $env:RUNNER_TEMP 'AnandaPatch144UpgradeFrom143'
          $p=Start-Process -FilePath $setup -ArgumentList @('/S',('/D='+$dest)) -PassThru -Wait
          if($p.ExitCode -ne 0){throw 'Separate Windows baseline install failed'}
          Copy-Item source/unpacked/app.asar (Join-Path $dest 'resources/app.asar') -Force
          foreach($previous in @('patch142','patch143')){
            $e=(Get-ChildItem $previous -Filter '*.exe'|Select-Object -First 1).FullName
            $p=Start-Process -FilePath $e -ArgumentList @('/S',('/D='+$dest)) -PassThru
            if(!$p.WaitForExit(90000)){Stop-Process -Id $p.Id -Force;throw "Previous $previous timed out"}
            if($p.ExitCode -ne 0){throw "Previous $previous update failed"}
          }
          $priorHash=(Get-FileHash (Join-Path $dest 'resources/app.asar') -Algorithm SHA256).Hash
          if($priorHash -ne '7AA1B9BDF9AF33E1385B27D5D45643E0A9937715D9965D0153990C20AAB01811'){throw 'Wrong Patch14.3 base'}
          $p=Start-Process -FilePath $exe -ArgumentList @('/S',('/D='+$dest)) -PassThru
          if(!$p.WaitForExit(90000)){Stop-Process -Id $p.Id -Force;throw 'Patch14.4 update from Patch14.3 timed out'}
          if($p.ExitCode -ne 0){throw 'Patch14.4 refused approved Patch14.3'}
          if((Get-FileHash (Join-Path $dest 'resources/app.asar') -Algorithm SHA256).Hash -ne $env:NEW_SHA){throw 'Wrong Patch14.4 source after 14.3'}
          if((Get-FileHash (Join-Path $dest 'resources/app.asar.before-patch14-4') -Algorithm SHA256).Hash -ne $priorHash){throw 'Patch14.3 backup missing'}
          Write-Host 'PASS actual Windows EXE direct upgrade 14.3 to 14.4; original saved in app backup'
      - name: Scan final EXE with Microsoft Defender
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist-patch14-4/Ananda-Patch14.4-VIEW-ONE-YELLOW-LINE-Installer.exe').Path
          $status=Get-MpComputerStatus -ErrorAction Stop
          if(!$status.AntivirusEnabled){throw 'Microsoft Defender not available'}
          try{Update-MpSignature -ErrorAction Stop}catch{Write-Host 'Signature update unavailable:' $_.Exception.Message}
          Start-MpScan -ScanType CustomScan -ScanPath $exe -ErrorAction Stop
          $hits=@(Get-MpThreatDetection -ErrorAction SilentlyContinue|Where-Object {($_.Resources -join ';') -match 'Ananda-Patch14.4-VIEW-ONE-YELLOW-LINE-Installer.exe'})
          if($hits.Count -gt 0){throw 'Defender detected updater'}
          if(!(Test-Path $exe)){throw 'Defender quarantined updater'}
          Write-Host 'PASS Microsoft Defender scan (not an absolute malware guarantee)'
      - uses: actions/upload-artifact@v4
        with:
          name: ananda-patch14-4-verified-windows-installer
          path: dist-patch14-4/Ananda-Patch14.4-VIEW-ONE-YELLOW-LINE-Installer.exe
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ananda-patch14-4-frozen-ui-verification
          path: |
            patch14-4-screenshots/*.png
            patch14-4-change-report.json
          if-no-files-found: error
  clamav:
    needs: windows-validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ananda-patch14-4-verified-windows-installer
          path: audit
      - name: Install updated independent malware scanner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --verbose
          clamscan --version
      - name: Scan exact updater EXE with ClamAV
        run: |
          test -s audit/Ananda-Patch14.4-VIEW-ONE-YELLOW-LINE-Installer.exe
          clamscan --infected --allmatch --max-filesize=200M --max-scansize=500M audit/Ananda-Patch14.4-VIEW-ONE-YELLOW-LINE-Installer.exe
          echo 'PASS independent ClamAV scan'
  release:
    needs: [windows-validate,clamav]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ananda-patch14-4-verified-windows-installer
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ananda-5.81.8-patch14-4-direct-view-one-yellow-divider
          name: Ananda Patch14.4 — Direct VIEW and One Yellow Divider
          prerelease: true
          files: release/Ananda-Patch14.4-VIEW-ONE-YELLOW-LINE-Installer.exe
          body: |
            One Windows EXE updater for verified existing Ananda Patch14.1, 14.2 or 14.3 installations.
            EXACTLY TWO CORRECTIONS:
            1. VIEW on the Events listing opens the existing approved EVENT RECORD page directly;
               no old EVENT TASKS landing page, and the correct EVENT RECORD tab still works.
            2. Exactly ONE yellow divider below the four event navigation buttons on Event Record,
               Volunteers, Attendees and Badge & Scarf. No redundant yellow topbar line.
            No other app screen, original sidebar, Class logic, attendee/volunteer data, badge rules,
            counts or persistent records changed; released Patch14.1 approved UI is the code baseline.
            Updates only app.asar; previous app code backed up to app.asar.before-patch14-4.
            Real Windows install/update, UI tests, saved family/phone/volunteer regression checks,
            offline data sentinel, Microsoft Defender and independent ClamAV must pass before release.
            The EXE is unsigned; do not bypass Windows antivirus or SmartScreen warnings.
