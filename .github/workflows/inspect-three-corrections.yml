name: Inspect three requested corrections
on:
  push:
    branches: [patch14-13-enrol-conducted-history-20261120]
    paths: ['.github/workflows/inspect-three-corrections.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract compact code neighborhoods
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('index.html').read_text(encoding='utf8').splitlines()
          groups={
           'enrol_auth':[r'REVIEW REQUIRED',r'APPROVAL MUST',r'approval must',r'override',r'adminPassword',r'admin password',r'function .*Enroll',r'function .*enrol',r'ReviewRequired',r'reviewRequired',r'authoriz',r'allow.*[Ll]evel'],
           'conducted':[r'CLASSES CONDUCTED',r'Classes Conducted',r'classes conducted',r'conductedCount',r'conductedClasses',r'classesConducted',r'sessionDates',r'sessionsConducted'],
           'add_student':[r'ADD STUDENT',r'SAVE STUDENT',r'KRIYA YEAR',r'Kriya Year',r'KRIYA DATE',r'match existing volunteer',r'addStudentModal',r'AddStudent',r'SaveStudent',r'v56.*Student']
          }
          for k,pats in groups.items():
            matches=[i for i,l in enumerate(lines) if any(re.search(p,l,re.I) for p in pats)]
            nums=set()
            for i in matches[:160]:
              for j in range(max(0,i-7),min(len(lines),i+12)):nums.add(j)
            out=['MATCHES '+str(len(matches))]
            for i in sorted(nums):
              out.append(f'{i+1:05d}: {lines[i][:850]}')
            Path('inspect-'+k+'.txt').write_text('\n'.join(out)[:190000],encoding='utf8')
          PY
      - name: Commit inspection
        run: |
          git config user.name "Ananda QA"
          git config user.email "actions@users.noreply.github.com"
          git add inspect-*.txt
          git commit -m "Inspect exact correction points"
          git push
