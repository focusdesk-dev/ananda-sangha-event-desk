name: Build Ananda Event Desk beta 5.26 Setup
on:
  workflow_dispatch:
  push:
    branches: [beta-5-26-windows-installer]
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate app logo and icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(128,128)
          $g=[System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode=[System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::White)
          $gold=New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255,195,41))
          $navy=New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(23,58,120))
          $g.FillEllipse($gold,4,4,120,120)
          $g.FillEllipse($navy,16,16,96,96)
          $pen=New-Object System.Drawing.Pen([System.Drawing.Color]::White,7)
          $g.DrawArc($pen,32,31,65,67,205,260)
          $bmp.Save("logo-128.png",[System.Drawing.Imaging.ImageFormat]::Png)
          $ico=[System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $out=[System.IO.File]::Create("ananda-icon.ico")
          $ico.Save($out)
          $out.Dispose()
          $ico.Dispose()
          $pen.Dispose()
          $gold.Dispose()
          $navy.Dispose()
          $g.Dispose()
          $bmp.Dispose()
      - name: Validate source files
        shell: pwsh
        run: |
          foreach ($file in @("package.json","index.html","main.js","preload.js","logo-128.png","ananda-icon.ico","scripts/prepare-assets.js")) {
            if (!(Test-Path $file)) { throw "Missing source file: $file" }
          }
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-beta-5.26-Setup
          path: dist/*.exe
          if-no-files-found: error
