name: Build Ananda Event Desk beta 5.39 Setup
on:
  workflow_dispatch:
  push:
    branches: [beta-5-39-attendance-status-preflight]
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore original Ananda logo and build Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $text = [IO.File]::ReadAllText("assets/original-ananda-logo.png.base64").Trim()
          [IO.File]::WriteAllBytes("logo-128.png", [Convert]::FromBase64String($text))
          $image = [Drawing.Image]::FromFile((Resolve-Path "logo-128.png").Path)
          $bitmap = New-Object System.Drawing.Bitmap(256, 256)
          $graphics = [Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([Drawing.Color]::Transparent)
          $graphics.InterpolationMode = [Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $graphics.DrawImage($image, 0, 0, 256, 256)
          $icon = [Drawing.Icon]::FromHandle($bitmap.GetHicon())
          $out = [IO.File]::Create("ananda-icon.ico")
          $icon.Save($out)
          $out.Dispose()
          $icon.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()
          $image.Dispose()
      - name: Validate source files
        shell: pwsh
        run: |
          foreach ($file in @("package.json","index.html","main.js","preload.js","omr-scanner.js","logo-128.png","ananda-icon.ico","scripts/prepare-assets.js")) {
            if (!(Test-Path $file)) { throw "Missing source file: $file" }
          }
      - run: npm install
      - run: npm run test:attendance
      - run: npm run test:ai
      - run: node scripts/verify-phone-ai-route.js
      - run: npm run test:ai-settings
      - run: npm run test:qr-print
      - run: npm run test:ai-recovery
      - run: npm run test:ai-performance
      - run: npm run test:unified
      - run: npm run test:attendance-permission
      - run: npm run test:attendance-ui
      - run: npm run test:batch-count
      - run: npm run test:enrol-shortcut
      - run: npm run test:attendance-status
      - run: npm run dist:win
      - name: Smoke test - launch packaged Windows desktop application
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/win-unpacked/Ananda Sangha Event Desk.exe"
          if (!(Test-Path $exe)) { throw "Packaged application executable missing: $exe" }
          $appProcess = Start-Process -FilePath $exe -ArgumentList "--remote-debugging-port=9223" -PassThru
          try {
            $found = $false
            for ($attempt = 0; $attempt -lt 18; $attempt++) {
              Start-Sleep -Seconds 2
              if ($appProcess.HasExited) { throw "Packaged desktop app exited during startup (exit code $($appProcess.ExitCode))" }
              try {
                $pages = Invoke-RestMethod -Uri "http://127.0.0.1:9223/json/list" -TimeoutSec 3
                $appPage = @($pages) | Where-Object { $_.type -eq 'page' -and ($_.url -match 'index.html' -or $_.title -match 'Ananda') }
                if ($appPage.Count -gt 0) { $found = $true; Write-Host "App opened successfully: $($appPage[0].title)"; break }
              } catch { Write-Host "Waiting for desktop window to load..." }
            }
            if (!$found) { throw "Packaged app did not expose a loaded Ananda window within the smoke check." }
          } finally {
            Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'Ananda Sangha Event Desk.exe' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-beta-5.39-Setup
          path: dist/*.exe
          if-no-files-found: error
