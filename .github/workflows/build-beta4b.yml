name: Build Phase 2 Windows Beta.4B

on:
  workflow_dispatch:
  push:
    branches: [phase2-development]

jobs:
  build-windows-beta4b:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Phase 2 source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore and run beta.4B build/test script
        shell: powershell
        run: |
          $parts=Get-ChildItem 'src/build-beta4b-ci.ps1.gz.b64.part*' | Sort-Object Name
          if(!$parts -or $parts.Count -ne 2){throw "Expected 2 beta.4B CI parts; found $($parts.Count)"}
          @'
          import base64,gzip,pathlib
          parts=sorted(pathlib.Path('src').glob('build-beta4b-ci.ps1.gz.b64.part*'))
          encoded=''.join(''.join(p.read_text(encoding='utf-8').split()) for p in parts)
          pathlib.Path('beta4b-ci.ps1').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          '@ | Set-Content restore_ci.py -Encoding utf8
          python restore_ci.py
          if($LASTEXITCODE -ne 0){throw 'Could not restore beta.4B CI script'}
          Remove-Item restore_ci.py -Force
          & .\beta4b-ci.ps1

      - name: Upload Phase 2 beta.4B Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-Phase2-Setup-v2.0.0-beta.4b
          path: src/dist/Ananda_Sangha_Event_Desk_Phase2_Setup_v2.0.0-beta.4b.exe
          if-no-files-found: error

      - name: Upload Phase 2 beta.4B handover
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-Phase2-Handover-v2.0.0-beta.4b
          path: ANANDA_SANGHA_EVENT_DESK_PHASE2_v2.0.0-beta.4b.zip
          if-no-files-found: error
