name: Inspect approval and conducted calculations
on:
  push:
    branches: [patch14-13-enrol-conducted-history-20261120]
    paths: ['.github/workflows/inspect-final-functions.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('index.html').read_text().splitlines()
          pats=[r'function v51RequireAdmin',r'function p2v519Plan',r'function p2v519Attendance',r'function p2v546ApprovedException',r'function p2v519Decision',r'function p2v550Stage',r'function p2v550Completed',r'function p2v5EnrollmentEligibleOn',r'function p2v5ValidDates']
          out=[]
          for pat in pats:
            matches=[i for i,l in enumerate(src) if re.search(pat,l)]
            out.append(pat+' MATCHES '+str(matches))
            for i in matches[:4]:
              out+= [f'{j+1:05d}: {src[j][:1300]}' for j in range(max(0,i-3),min(len(src),i+45))]
          Path('precise-final.txt').write_text('\n'.join(out)[:160000])
          PY
      - name: Commit
        run: |
          git config user.name "Ananda QA"
          git config user.email "actions@users.noreply.github.com"
          git add precise-final.txt
          git commit -m "Inspect eligibility and conducted source"
          git push
