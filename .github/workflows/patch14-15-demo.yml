name: Build Patch 14.15 demo four narrow fixes
on:
  push:
    branches: [patch14-15-demo-four-fixes-20261122]
    paths: ['.github/workflows/patch14-15-demo.yml']
permissions:
  contents: write
jobs:
  small-patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified previous small patch and extract its app archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path prior,extracted,build,payload,dist-patch14-15 | Out-Null
          gh release download patch14.14-safe-three-fixes --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir prior
          if($LASTEXITCODE -ne 0){throw 'Patch 14.11 installer missing'}
          $patch=(Get-ChildItem prior -Filter '*.exe' | Select-Object -First 1).FullName
          & 'C:\Program Files\7-Zip\7z.exe' x $patch '-oextracted' -y
          if($LASTEXITCODE -ne 0){throw 'Could not extract approved 14.10 updater'}
          $files=@(Get-ChildItem extracted -Filter 'app.asar' -Recurse)
          Write-Host 'App archives:' $files.Count
          if($files.Count -ne 1){throw 'Cannot uniquely identify approved 14.10 app.asar'}
          Copy-Item $files[0].FullName build/base.asar
          $base=(Get-FileHash build/base.asar -Algorithm SHA256).Hash.ToLowerInvariant()
          "BASE_SHA=$base" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Verified extracted 14.12 baseline hash:' $base
      - name: Change one feature inside the existing archive
        shell: pwsh
        run: |
          npm install --prefix .patch-tools --no-save --no-audit --no-fund --ignore-scripts @electron/asar@3.2.18
          if($LASTEXITCODE -ne 0){throw 'ASAR tools failed'}
          node -e "require('./.patch-tools/node_modules/@electron/asar').extractAll('build/base.asar','build/app')"
          $env:ANANDA_INDEX_PATH='build/app/index.html'
          node scripts/apply-patch14-15.js
          if($LASTEXITCODE -ne 0){throw 'Serial update failed'}
          node --check scripts/apply-patch14-15.js
          node -e "const fs=require('fs');const s=fs.readFileSync('build/app/index.html','utf8');for(const t of ['p1415SaveOriginal','p1415RemoveEnrollment','p1415StudentDropdownStyle','const matches=!student'])if(!s.includes(t))throw Error('Missing agreed demo correction '+t);console.log('PASS four demo fixes present')"
          node -e "const vm=require('vm'),fs=require('fs');const s=fs.readFileSync('build/app/index.html','utf8');const matches=[...s.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)];for(const m of matches){if(m[2].trim()&&!m[1].includes('src='))new vm.Script(m[2]);}console.log('PASS all inline JavaScript syntax checks')"
          node -e "require('./.patch-tools/node_modules/@electron/asar').createPackage('build/app','payload/app.asar').then(()=>console.log('small archive ready'))"
          if($LASTEXITCODE -ne 0){throw 'Archive packaging failed'}
          $new=(Get-FileHash payload/app.asar -Algorithm SHA256).Hash.ToLowerInvariant()
          if($new -eq $env:BASE_SHA){throw 'Patch makes no change'}
          "NEW_SHA=$new" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $baseline=Get-ChildItem build/app -Recurse -File | Where-Object { $_.FullName -notmatch 'index.html
      - name: Build small NSIS in-place updater
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if($LASTEXITCODE -ne 0){throw 'NSIS unavailable'}
          $nsi=[IO.File]::ReadAllText((Join-Path $PWD 'Patch14-15-Standard-Update.nsi'))
          $nsi=$nsi.Replace('__BASE_SHA__',$env:BASE_SHA).Replace('__NEW_SHA__',$env:NEW_SHA)
          [IO.File]::WriteAllText((Join-Path $PWD 'Patch14-15-Generated.nsi'),$nsi)
          & 'C:\Program Files (x86)\NSIS\makensis.exe' '/V4' 'Patch14-15-Generated.nsi'
          if($LASTEXITCODE -ne 0){throw 'Updater build failed'}
          $exe='dist-patch14-15/Ananda-Patch14.15-DEMO-FOUR-FIXES-Update.exe'
          if(!(Test-Path $exe)){throw 'Patch file missing'}
          Write-Host 'SMALL_PATCH_BYTES:' (Get-Item $exe).Length
      - name: Verify in-place patch installation and original data remains unchanged
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'Ananda Installed Test'
          New-Item -ItemType Directory -Path (Join-Path $dir 'resources') -Force | Out-Null
          Copy-Item build/base.asar (Join-Path $dir 'resources/app.asar')
          $exe=(Resolve-Path 'dist-patch14-15/Ananda-Patch14.15-DEMO-FOUR-FIXES-Update.exe').Path
          $proc=Start-Process -FilePath $exe -ArgumentList @('/S',('/D='+$dir)) -PassThru -Wait
          if($proc.ExitCode -ne 0){throw 'Patch failed on existing app folder'}
          if((Get-FileHash (Join-Path $dir 'resources/app.asar') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:NEW_SHA){throw 'Patched archive hash mismatch'}
          if((Get-FileHash (Join-Path $dir 'resources/app.asar.before-patch14-15') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:BASE_SHA){throw 'Backup mismatch'}
          Write-Host 'PASS existing installed archive update, backup and hash validation'
      - uses: actions/upload-artifact@v4
        with:
          name: Ananda-Patch14.12-SERIAL-ATTENDANCE-Update
          path: dist-patch14-15/Ananda-Patch14.15-DEMO-FOUR-FIXES-Update.exe
          if-no-files-found: error
      - name: Publish direct patch download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create patch14.15-demo-four-fixes 'dist-patch14-15/Ananda-Patch14.15-DEMO-FOUR-FIXES-Update.exe' --target ${{ github.sha }} --title 'Ananda Patch 14.15 - Demo Four Fixes' --notes 'Small in-place patch over verified Patch14.14. Fixes only attendance synchronisation, accidental enrolment removal, compact Student Wise search and recorded Kriya initiation date or year. Does not reinstall Electron or touch the user database.'
 } | Measure-Object
          Write-Host 'Only index.html patched. Other app files kept:' $baseline.Count
          Write-Host 'Original application archive changed ONLY in index.html'
      - name: Build small NSIS in-place updater
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if($LASTEXITCODE -ne 0){throw 'NSIS unavailable'}
          $nsi=[IO.File]::ReadAllText((Join-Path $PWD 'Patch14-15-Standard-Update.nsi'))
          $nsi=$nsi.Replace('__BASE_SHA__',$env:BASE_SHA).Replace('__NEW_SHA__',$env:NEW_SHA)
          [IO.File]::WriteAllText((Join-Path $PWD 'Patch14-15-Generated.nsi'),$nsi)
          & 'C:\Program Files (x86)\NSIS\makensis.exe' '/V4' 'Patch14-15-Generated.nsi'
          if($LASTEXITCODE -ne 0){throw 'Updater build failed'}
          $exe='dist-patch14-15/Ananda-Patch14.15-DEMO-FOUR-FIXES-Update.exe'
          if(!(Test-Path $exe)){throw 'Patch file missing'}
          Write-Host 'SMALL_PATCH_BYTES:' (Get-Item $exe).Length
      - name: Verify in-place patch installation and original data remains unchanged
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'Ananda Installed Test'
          New-Item -ItemType Directory -Path (Join-Path $dir 'resources') -Force | Out-Null
          Copy-Item build/base.asar (Join-Path $dir 'resources/app.asar')
          $exe=(Resolve-Path 'dist-patch14-15/Ananda-Patch14.15-DEMO-FOUR-FIXES-Update.exe').Path
          $proc=Start-Process -FilePath $exe -ArgumentList @('/S',('/D='+$dir)) -PassThru -Wait
          if($proc.ExitCode -ne 0){throw 'Patch failed on existing app folder'}
          if((Get-FileHash (Join-Path $dir 'resources/app.asar') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:NEW_SHA){throw 'Patched archive hash mismatch'}
          if((Get-FileHash (Join-Path $dir 'resources/app.asar.before-patch14-15') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:BASE_SHA){throw 'Backup mismatch'}
          Write-Host 'PASS existing installed archive update, backup and hash validation'
      - uses: actions/upload-artifact@v4
        with:
          name: Ananda-Patch14.12-SERIAL-ATTENDANCE-Update
          path: dist-patch14-15/Ananda-Patch14.15-DEMO-FOUR-FIXES-Update.exe
          if-no-files-found: error
      - name: Publish direct patch download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create patch14.15-demo-four-fixes 'dist-patch14-15/Ananda-Patch14.15-DEMO-FOUR-FIXES-Update.exe' --target ${{ github.sha }} --title 'Ananda Patch 14.15 - Demo Four Fixes' --notes 'Small in-place patch over verified Patch14.14. Fixes only attendance synchronisation, accidental enrolment removal, compact Student Wise search and recorded Kriya initiation date or year. Does not reinstall Electron or touch the user database.'
