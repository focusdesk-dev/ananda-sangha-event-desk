name: Build Windows Production Installer

on:
  workflow_dispatch:
  push:
    branches: [production-v129-update]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore verified application HTML and apply production patch
        shell: powershell
        run: |
          @'
          import base64, gzip, pathlib, binascii
          parts = sorted(pathlib.Path('assets').glob('index.html.gz.b64.part*'))
          if len(parts) != 8:
              raise SystemExit(f'Expected 8 HTML parts, found {len(parts)}')
          raw = base64.b64decode(b''.join(b''.join(p.read_bytes().split()) for p in parts), validate=True)
          html = gzip.decompress(raw)
          if len(html) != 488870 or (binascii.crc32(html) & 0xffffffff) != 0x41243984:
              raise SystemExit('Base HTML checksum/size validation failed')
          text = html.decode('utf-8')
          for marker in ['<html', '</html>', 'ANANDA', 'addVolunteer', 'addAttendeeMaster', 'addKriyaban', 'addVip', 'v36NewRegistration', 'eventForm']:
              if marker.lower() not in text.lower():
                  raise SystemExit(f'Missing application marker: {marker}')
          patch_path = pathlib.Path('src/production-patch.js')
          if not patch_path.exists():
              raise SystemExit('production-patch.js is missing')
          patch = patch_path.read_text(encoding='utf-8')
          if 'Production patch 1.0.129' not in patch:
              raise SystemExit('Unexpected production patch version')
          if '</body>' not in text:
              raise SystemExit('Could not find closing body tag for patch injection')
          text = text.replace('</body>', '<script>\n' + patch + '\n</script>\n</body>', 1)
          pathlib.Path('src/index.html').write_text(text, encoding='utf-8')
          print(f'VERIFIED BASE HTML: {len(html)} bytes, CRC32 41243984')
          print(f'PATCHED HTML: {len(text.encode("utf-8"))} bytes')
          '@ | Set-Content restore_html.py -Encoding utf8
          python restore_html.py
          Remove-Item restore_html.py -Force

      - name: Restore and prepare Ananda Windows icon
        shell: powershell
        run: |
          $parts = Get-ChildItem 'assets/logo-128.png.b64.part*' | Sort-Object Name
          if (!$parts -or $parts.Count -ne 4) { throw "Expected 4 logo parts; found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $logo = Join-Path $PWD 'src/logo-128.png'
          [IO.File]::WriteAllBytes($logo, [Convert]::FromBase64String($b64))
          if ((Get-Item $logo).Length -ne 22678) { throw 'Verified source logo size mismatch.' }

          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile($logo)
          try {
            if ($src.Width -ne 128 -or $src.Height -ne 128) { throw "Unexpected source logo dimensions: $($src.Width)x$($src.Height)" }
            $bmp = New-Object System.Drawing.Bitmap 256,256
            try {
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              try {
                $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
                $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
                $g.DrawImage($src, 0, 0, 256, 256)
              } finally { $g.Dispose() }
              $tmp = Join-Path $PWD 'src/logo-256.tmp.png'
              $bmp.Save($tmp, [System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $bmp.Dispose() }
          } finally { $src.Dispose() }
          Move-Item $tmp $logo -Force
          $check = [System.Drawing.Image]::FromFile($logo)
          try {
            if ($check.Width -ne 256 -or $check.Height -ne 256) { throw 'Windows icon resize failed.' }
            Write-Host "VERIFIED WINDOWS ICON: $($check.Width)x$($check.Height)"
          } finally { $check.Dispose() }

      - name: Set production version in Electron shell
        shell: powershell
        run: |
          $path = 'src/main.js'
          $content = Get-Content $path -Raw
          $updated = [regex]::Replace($content, "const APP_VERSION = '[^']+';", "const APP_VERSION = '1.0.129';", 1)
          if ($updated -eq $content) { throw 'APP_VERSION marker was not updated in main.js' }
          Set-Content $path $updated -Encoding utf8
          Write-Host 'Electron shell version set to 1.0.129'

      - name: Validate Electron source and production patch
        working-directory: src
        shell: powershell
        run: |
          node --check main.js
          node --check preload.js
          node --check production-patch.js
          if (!(Test-Path 'installer.nsh')) { throw 'installer.nsh is missing.' }
          if (!(Test-Path 'index.html')) { throw 'index.html is missing.' }
          if (!(Test-Path 'logo-128.png')) { throw 'logo is missing.' }
          if ((Get-Content package.json -Raw) -notmatch '"version"\s*:\s*"1\.0\.129"') { throw 'package.json is not version 1.0.129' }
          Write-Host 'Electron source and patch validation passed.'

      - name: Install build dependencies
        working-directory: src
        run: npm install

      - name: Build real Windows Setup.exe
        working-directory: src
        run: npm run dist

      - name: Verify installer exists
        shell: powershell
        run: |
          $setup = 'src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe'
          $app = 'src/dist/win-unpacked/Ananda Sangha Event Desk.exe'
          if (!(Test-Path $setup)) { throw "Installer not created: $setup" }
          if (!(Test-Path $app)) { throw "Application executable not created: $app" }
          $size = (Get-Item $setup).Length
          $appSize = (Get-Item $app).Length
          if ($size -lt 50000000) { throw "Installer too small: $size bytes" }
          if ($appSize -lt 1000000) { throw "App executable too small: $appSize bytes" }
          Write-Host "VERIFIED INSTALLER: $size bytes"
          Write-Host "VERIFIED APP EXE: $appSize bytes"

      - name: Create NGO handover folder
        shell: powershell
        run: |
          $root = Join-Path $PWD 'handover/ANANDA SANGHA EVENT DESK'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Installer'),(Join-Path $root 'Data'),(Join-Path $root 'Backup/Automatic'),(Join-Path $root 'Backup/Manual') | Out-Null
          Copy-Item 'src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe' (Join-Path $root 'Installer/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe') -Force
          Set-Content (Join-Path $root 'VERSION.txt') "ANANDA SANGHA EVENT DESK`r`nNGO PRODUCTION`r`nVersion 1.0.129`r`nWindows NSIS installer + uninstaller`r`nDesktop + Start Menu shortcut`r`nData preserved on uninstall`r`nAutomatic backup: every 5 days`r`nKeyboard: + Add/New | Alt+S Save | Esc Back" -Encoding utf8
          Set-Content (Join-Path $root 'README_START_HERE.txt') "1. Open Installer.`r`n2. Run Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe.`r`n3. Complete the Windows setup wizard.`r`n4. Desktop and Start Menu shortcuts are created.`r`n5. Uninstall from Windows Installed Apps.`r`n6. NGO data/backups are retained.`r`n7. For an update, install this version over the existing installation; do not delete the NGO Data folder." -Encoding utf8

      - name: Compress NGO handover
        shell: powershell
        run: Compress-Archive -Path 'handover/ANANDA SANGHA EVENT DESK' -DestinationPath 'ANANDA_SANGHA_EVENT_DESK_NGO_PRODUCTION_v1.0.129.zip' -CompressionLevel Optimal

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-Setup-v1.0.129
          path: src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe
          if-no-files-found: error

      - name: Upload complete NGO handover
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-NGO-Handover-v1.0.129
          path: ANANDA_SANGHA_EVENT_DESK_NGO_PRODUCTION_v1.0.129.zip
          if-no-files-found: error
