name: Build Windows Clean Production v129

on:
  workflow_dispatch:
  push:
    branches:
      - production-v129-clean-rebuild

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore and verify exact application source
        shell: powershell
        run: |
          @'
          import base64, gzip, pathlib, zlib, hashlib
          parts = sorted(pathlib.Path('assets').glob('index.html.gz.b64.part*'))
          if len(parts) != 8:
              raise SystemExit(f'Expected exactly 8 source parts, found {len(parts)}')
          payload = ''.join(p.read_text().strip() for p in parts)
          raw = gzip.decompress(base64.b64decode(payload, validate=True))
          crc = zlib.crc32(raw) & 0xffffffff
          if len(raw) != 488870:
              raise SystemExit(f'Wrong application source length: {len(raw)}')
          if crc != 0x41243984:
              raise SystemExit(f'Wrong application source CRC32: {crc:08x}')
          text = raw.decode('utf-8')
          required = ['<html', '</html>', 'addVolunteer', 'addAttendeeMaster', 'addKriyaban', 'addVip', 'v36NewRegistration', 'eventForm', 'onShortcut', 'autoBackupState']
          missing = [m for m in required if m.lower() not in text.lower()]
          if missing:
              raise SystemExit(f'Missing application markers: {missing}')
          pathlib.Path('src/index.html').write_bytes(raw)
          print('VERIFIED CLEAN APP SOURCE', len(raw), f'CRC32={crc:08x}', hashlib.sha256(raw).hexdigest())
          '@ | Set-Content restore_source.py -Encoding utf8
          python restore_source.py
          Remove-Item restore_source.py -Force

      - name: Restore and verify Ananda logo
        shell: powershell
        run: |
          $b64 = (Get-Content 'assets/logo-128.png.b64' -Raw).Trim()
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes((Join-Path $PWD 'src/logo-128.png'), $bytes)
          if ($bytes.Length -ne 22678) { throw "Wrong logo size: $($bytes.Length)" }
          if ($bytes[0] -ne 137 -or $bytes[1] -ne 80 -or $bytes[2] -ne 78 -or $bytes[3] -ne 71) { throw 'Logo is not a valid PNG.' }
          Write-Host "VERIFIED LOGO: $($bytes.Length) bytes"

      - name: Validate desktop application source
        working-directory: src
        shell: powershell
        run: |
          $main = Get-Content 'main.js' -Raw
          $main = $main.Replace("const APP_VERSION = '1.0.128';", "const APP_VERSION = '1.0.129';")
          Set-Content 'main.js' $main -Encoding utf8
          node --check main.js
          node --check preload.js
          if (!(Test-Path 'installer.nsh')) { throw 'installer.nsh missing.' }
          if (!(Test-Path 'index.html')) { throw 'index.html missing.' }
          if ((Get-Content 'index.html' -Raw).IndexOf('Alt+S', [StringComparison]::OrdinalIgnoreCase) -lt 0) { Write-Host 'Shortcut UI text is not required; JS marker already verified.' }
          Write-Host 'Desktop source validation passed.'

      - name: Install build dependencies
        working-directory: src
        run: npm install

      - name: Build real Windows Setup.exe
        working-directory: src
        run: npm run dist

      - name: Verify installer and application executable
        shell: powershell
        run: |
          $setup = 'src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe'
          $unpacked = 'src/dist/win-unpacked/Ananda Sangha Event Desk.exe'
          if (!(Test-Path $setup)) { throw "Installer not created: $setup" }
          if (!(Test-Path $unpacked)) { throw "Application executable not created: $unpacked" }
          $setupSize = (Get-Item $setup).Length
          $appSize = (Get-Item $unpacked).Length
          if ($setupSize -lt 50000000) { throw "Installer unexpectedly small: $setupSize bytes" }
          if ($appSize -lt 1000000) { throw "Application executable unexpectedly small: $appSize bytes" }
          Write-Host "VERIFIED INSTALLER: $setupSize bytes"
          Write-Host "VERIFIED APP EXE: $appSize bytes"

      - name: Create complete NGO handover ZIP
        shell: powershell
        run: |
          $root = Join-Path $PWD 'handover/ANANDA SANGHA EVENT DESK'
          $installer = Join-Path $root 'Installer'
          $data = Join-Path $root 'Data'
          $auto = Join-Path $root 'Backup/Automatic'
          $manual = Join-Path $root 'Backup/Manual'
          New-Item -ItemType Directory -Force -Path $installer,$data,$auto,$manual | Out-Null
          Copy-Item 'src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe' (Join-Path $installer 'Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe') -Force
          Set-Content (Join-Path $root 'VERSION.txt') "ANANDA SANGHA EVENT DESK`r`nClean NGO Production v1.0.129`r`nVerified source: 488870 bytes / CRC32 41243984`r`nKeyboard: + Add/New | Alt+S Save`r`nAutomatic backup: every 5 days on app launch" -Encoding utf8
          Set-Content (Join-Path $data 'README_DATA_FOLDER.txt') 'Installed application records are kept in Documents\ANANDA SANGHA EVENT DESK\Data. Uninstalling the program does not delete this folder.' -Encoding utf8
          Set-Content (Join-Path $root 'README_START_HERE.txt') "1. Open Installer.`r`n2. Run Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe.`r`n3. Complete the normal Windows installer wizard.`r`n4. Setup creates Desktop and Start Menu shortcuts.`r`n5. Windows Installed Apps contains the Uninstaller.`r`n6. Documents\ANANDA SANGHA EVENT DESK stores Data, Backups and a saved copy of the installer.`r`n7. Uninstalling removes the program but keeps NGO records and backups.`r`n8. Keyboard shortcuts: + = Add/New and Alt+S = Save." -Encoding utf8
          Compress-Archive -Path $root -DestinationPath 'ANANDA_SANGHA_EVENT_DESK_NGO_PRODUCTION_v1.0.129.zip' -CompressionLevel Optimal

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-Setup-v1.0.129
          path: src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe
          if-no-files-found: error

      - name: Upload complete NGO handover ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-NGO-Handover-v1.0.129
          path: ANANDA_SANGHA_EVENT_DESK_NGO_PRODUCTION_v1.0.129.zip
          if-no-files-found: error
