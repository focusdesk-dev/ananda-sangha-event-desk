name: Build Windows Production Installer

on:
  workflow_dispatch:
  push:
    branches:
      - production-v128-installer

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover exact application HTML from chunk history
        shell: powershell
        run: |
          @'
          import base64
          import gzip
          import hashlib
          import itertools
          import pathlib
          import subprocess
          import sys

          asset_dir = pathlib.Path('assets')
          paths = sorted(asset_dir.glob('index.html.gz.b64.part*'))
          if len(paths) < 2:
              raise SystemExit('Compressed HTML source parts are missing.')

          required = [
              '<html', '</html>', 'ANANDA', 'addVolunteer',
              'addAttendeeMaster', 'addKriyaban', 'addVip',
              'v36NewRegistration', 'eventForm'
          ]

          def git_bytes(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          candidate_lists = []
          candidate_meta = []
          for path in paths:
              rel = path.as_posix()
              commits = git_bytes('log', '--all', '--format=%H', '--', rel).decode().splitlines()
              seen = set()
              candidates = []
              metas = []

              # Current working-tree value first.
              current = b''.join(path.read_bytes().split())
              digest = hashlib.sha256(current).hexdigest()
              seen.add(digest)
              candidates.append(current)
              metas.append(f'WORKTREE:{digest[:12]}')

              for commit in commits:
                  try:
                      raw = git_bytes('show', f'{commit}:{rel}')
                  except subprocess.CalledProcessError:
                      continue
                  compact = b''.join(raw.split())
                  digest = hashlib.sha256(compact).hexdigest()
                  if digest in seen:
                      continue
                  seen.add(digest)
                  candidates.append(compact)
                  metas.append(f'{commit[:12]}:{digest[:12]}')

              print(f'{rel}: {len(candidates)} unique historical candidate(s)')
              candidate_lists.append(candidates)
              candidate_meta.append(metas)

          total = 1
          for candidates in candidate_lists:
              total *= len(candidates)
          print(f'Testing {total} chunk combinations...')
          if total > 20000:
              raise SystemExit(f'Refusing unexpectedly large recovery search: {total} combinations')

          output = pathlib.Path('src/index.html')
          selected = None
          tested = 0
          for indexes in itertools.product(*[range(len(c)) for c in candidate_lists]):
              tested += 1
              b64 = b''.join(candidate_lists[i][idx] for i, idx in enumerate(indexes))
              try:
                  compressed = base64.b64decode(b64, validate=True)
                  html_bytes = gzip.decompress(compressed)
                  if len(html_bytes) < 400000:
                      continue
                  html = html_bytes.decode('utf-8')
              except Exception:
                  continue

              if not all(marker.lower() in html.lower() for marker in required):
                  continue
              if html.count('<script') < 1 or html.count('</script>') < 1:
                  continue
              if html.count('<style') < 1 or html.count('</style>') < 1:
                  continue

              output.write_bytes(html_bytes)
              selected = indexes
              print(f'VALID APPLICATION HTML RECOVERED: {len(html_bytes)} bytes after {tested} combination(s).')
              for i, idx in enumerate(indexes):
                  print(f'  {paths[i].name} <- {candidate_meta[i][idx]}')
              break

          if selected is None:
              raise SystemExit('No checksum-valid, UTF-8, structurally valid application HTML could be reconstructed from Git history.')
          '@ | Set-Content -Path recover_html.py -Encoding utf8
          python recover_html.py
          Remove-Item recover_html.py -Force

      - name: Restore Ananda logo
        shell: powershell
        run: |
          $b64 = (Get-Content 'assets/logo-128.png.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes((Join-Path $PWD 'src/logo-128.png'), [Convert]::FromBase64String($b64))
          if ((Get-Item 'src/logo-128.png').Length -lt 10000) { throw 'Logo restore failed.' }

      - name: Validate Electron source
        working-directory: src
        shell: powershell
        run: |
          node --check main.js
          node --check preload.js
          if (!(Test-Path 'installer.nsh')) { throw 'installer.nsh is missing.' }
          if (!(Test-Path 'index.html')) { throw 'index.html is missing after recovery.' }
          $html = Get-Content 'index.html' -Raw
          foreach ($marker in @('addVolunteer','addAttendeeMaster','addKriyaban','addVip','v36NewRegistration','eventForm')) {
            if ($html.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -lt 0) { throw "index.html validation failed: $marker" }
          }
          Write-Host 'Electron source validation passed.'

      - name: Install build dependencies
        working-directory: src
        run: npm install

      - name: Build real Windows Setup.exe
        working-directory: src
        run: npm run dist

      - name: Verify installer exists
        shell: powershell
        run: |
          $setup = 'src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.128.exe'
          $unpacked = 'src/dist/win-unpacked/Ananda Sangha Event Desk.exe'
          if (!(Test-Path $setup)) { throw "Installer not created: $setup" }
          if (!(Test-Path $unpacked)) { throw "Unpacked application executable not created: $unpacked" }
          $size = (Get-Item $setup).Length
          $appSize = (Get-Item $unpacked).Length
          if ($size -lt 50000000) { throw "Installer looks too small: $size bytes" }
          if ($appSize -lt 1000000) { throw "Application executable looks too small: $appSize bytes" }
          Write-Host "VERIFIED INSTALLER: $setup ($size bytes)"
          Write-Host "VERIFIED APP EXE: $unpacked ($appSize bytes)"

      - name: Create NGO handover folder
        shell: powershell
        run: |
          $root = Join-Path $PWD 'handover/ANANDA SANGHA EVENT DESK'
          $installer = Join-Path $root 'Installer'
          $data = Join-Path $root 'Data'
          $auto = Join-Path $root 'Backup/Automatic'
          $manual = Join-Path $root 'Backup/Manual'
          New-Item -ItemType Directory -Force -Path $installer,$data,$auto,$manual | Out-Null
          Copy-Item 'src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.128.exe' (Join-Path $installer 'Ananda_Sangha_Event_Desk_Setup_v1.0.128.exe') -Force
          Set-Content (Join-Path $root 'VERSION.txt') "ANANDA SANGHA EVENT DESK`r`nNGO PRODUCTION`r`nVersion 1.0.128`r`nInstaller: Windows NSIS Setup.exe`r`nUninstaller: Windows Installed Apps + Start Menu`r`nData preserved on uninstall`r`nAutomatic backup: every 5 days on app launch`r`nKeyboard: + Add/New | Alt+S Save" -Encoding utf8
          Set-Content (Join-Path $data 'README_DATA_FOLDER.txt') 'After installation, permanent NGO data is stored in Documents\ANANDA SANGHA EVENT DESK\Data. Copy that Documents folder when handing the system to another PC.' -Encoding utf8
          Set-Content (Join-Path $root 'README_START_HERE.txt') "1. Open Installer.`r`n2. Run Ananda_Sangha_Event_Desk_Setup_v1.0.128.exe.`r`n3. Complete the normal Windows installer wizard.`r`n4. The installer creates Desktop and Start Menu shortcuts.`r`n5. Windows Installed Apps contains the Uninstaller.`r`n6. Documents\ANANDA SANGHA EVENT DESK stores Data, Backups and a copy of this installer.`r`n7. Uninstalling removes the program but keeps NGO records and backups." -Encoding utf8

      - name: Compress NGO handover
        shell: powershell
        run: Compress-Archive -Path 'handover/ANANDA SANGHA EVENT DESK' -DestinationPath 'ANANDA_SANGHA_EVENT_DESK_NGO_PRODUCTION_v1.0.128.zip' -CompressionLevel Optimal

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-Setup-v1.0.128
          path: src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.128.exe
          if-no-files-found: error

      - name: Upload complete NGO handover
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-NGO-Handover-v1.0.128
          path: ANANDA_SANGHA_EVENT_DESK_NGO_PRODUCTION_v1.0.128.zip
          if-no-files-found: error
