name: Build Windows Production Installer

on:
  workflow_dispatch:
  push:
    branches: [production-v129-update]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore verified working base HTML
        shell: powershell
        run: |
          @'
          import base64, gzip, pathlib, binascii
          parts = sorted(pathlib.Path('assets').glob('index.html.gz.b64.part*'))
          if len(parts) != 8:
              raise SystemExit(f'Expected 8 HTML parts, found {len(parts)}')
          raw = base64.b64decode(b''.join(b''.join(p.read_bytes().split()) for p in parts), validate=True)
          html = gzip.decompress(raw)
          if len(html) != 488870 or (binascii.crc32(html) & 0xffffffff) != 0x41243984:
              raise SystemExit('Working base HTML checksum/size validation failed')
          text = html.decode('utf-8')
          for marker in ['<html', '</html>', 'ANANDA', 'addVolunteer', 'addAttendeeMaster', 'addKriyaban', 'addVip', 'v36NewRegistration', 'eventForm']:
              if marker.lower() not in text.lower():
                  raise SystemExit(f'Missing base application marker: {marker}')
          pathlib.Path('src/index.html').write_bytes(html)
          print('VERIFIED WORKING BASE HTML: 488870 bytes, CRC32 41243984')
          '@ | Set-Content restore_html.py -Encoding utf8
          python restore_html.py
          Remove-Item restore_html.py -Force

      - name: Build clean 1.0.129 source from working base
        shell: powershell
        run: |
          if (!(Test-Path 'src/build-clean129.py')) { throw 'build-clean129.py is missing.' }
          @'
          from pathlib import Path
          p=Path('src/build-clean129.py')
          b=p.read_bytes()
          b=b.replace(b'expected_size = 491414', b'expected_size = 491328')
          b=b.replace(b'expected_crc = 0xed7c3111', b'expected_crc = 0x1484eb85')
          b=b.replace(b"expected_sha = '4737255254f9f1d0951f5365944049d15c4c97434c1be16fbb8ed394bcaf72d9'", b"expected_sha = '390a75590e7fc0cd0f0199295bd684d830f96656ced48cc0789c0c9c037bd113'")
          p.write_bytes(b)
          '@ | Set-Content fix_clean_verifier.py -Encoding utf8
          python fix_clean_verifier.py
          Remove-Item fix_clean_verifier.py -Force
          python src/build-clean129.py

      - name: Validate clean 1.0.129 HTML and every inline script
        shell: powershell
        run: |
          @'
          import pathlib, re, binascii, hashlib
          path = pathlib.Path('src/index.html')
          html = path.read_bytes()
          if len(html) != 491328:
              raise SystemExit(f'Clean HTML size mismatch: {len(html)}')
          if (binascii.crc32(html) & 0xffffffff) != 0x1484eb85:
              raise SystemExit('Clean HTML CRC32 validation failed')
          if hashlib.sha256(html).hexdigest() != '390a75590e7fc0cd0f0199295bd684d830f96656ced48cc0789c0c9c037bd113':
              raise SystemExit('Clean HTML SHA256 validation failed')
          text = html.decode('utf-8')
          for marker in ['Production 1.0.129', "key==='escape'", 'focusMap=', 'Do not add that volunteer to the event roster automatically']:
              if marker not in text:
                  raise SystemExit(f'Missing clean 1.0.129 marker: {marker}')
          if 'Production patch 1.0.129' in text:
              raise SystemExit('Old injected production patch is still present')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          if len(scripts) < 5:
              raise SystemExit(f'Unexpected script count: {len(scripts)}')
          out = pathlib.Path('script-check')
          out.mkdir(exist_ok=True)
          for i, script in enumerate(scripts):
              (out / f'script-{i:02d}.js').write_text(script, encoding='utf-8')
          print(f'VERIFIED CLEAN HTML AND EXTRACTED {len(scripts)} SCRIPT BLOCKS')
          '@ | Set-Content validate_html.py -Encoding utf8
          python validate_html.py
          Get-ChildItem 'script-check\*.js' | ForEach-Object { node --check $_.FullName }
          Remove-Item validate_html.py -Force
          Remove-Item script-check -Recurse -Force
          Write-Host 'ALL INLINE APPLICATION SCRIPTS PASSED NODE SYNTAX CHECK'

      - name: Restore Ananda logo and build multi-resolution Windows icon
        shell: powershell
        run: |
          $parts = Get-ChildItem 'assets/logo-128.png.b64.part*' | Sort-Object Name
          if (!$parts -or $parts.Count -ne 4) { throw "Expected 4 logo parts; found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $logo = Join-Path $PWD 'src/logo-128.png'
          [IO.File]::WriteAllBytes($logo, [Convert]::FromBase64String($b64))
          if ((Get-Item $logo).Length -ne 22678) { throw 'Verified source logo size mismatch.' }

          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile($logo)
          try {
            if ($src.Width -ne 128 -or $src.Height -ne 128) { throw "Unexpected source logo dimensions: $($src.Width)x$($src.Height)" }
            $sizes = @(16,20,24,32,40,48,64,128,256)
            $frames = @()
            foreach ($size in $sizes) {
              $bmp = [System.Drawing.Bitmap]::new($size,$size,[System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              try {
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                try {
                  $g.Clear([System.Drawing.Color]::Transparent)
                  $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                  $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
                  $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
                  $g.CompositingQuality = [System.Drawing.Drawing2D.CompositingQuality]::HighQuality
                  $g.DrawImage($src,0,0,$size,$size)
                } finally { $g.Dispose() }
                $ms = [System.IO.MemoryStream]::new()
                try {
                  $bmp.Save($ms,[System.Drawing.Imaging.ImageFormat]::Png)
                  $frames += [PSCustomObject]@{ Size=$size; Bytes=$ms.ToArray() }
                } finally { $ms.Dispose() }
              } finally { $bmp.Dispose() }
            }
          } finally { $src.Dispose() }

          $icon = Join-Path $PWD 'src/ananda-icon.ico'
          $stream = [System.IO.File]::Open($icon,[System.IO.FileMode]::Create)
          $writer = [System.IO.BinaryWriter]::new($stream)
          try {
            $writer.Write([UInt16]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]$frames.Count)
            $offset = 6 + (16 * $frames.Count)
            foreach ($frame in $frames) {
              $dimension = if ($frame.Size -ge 256) { 0 } else { $frame.Size }
              $writer.Write([byte]$dimension)
              $writer.Write([byte]$dimension)
              $writer.Write([byte]0)
              $writer.Write([byte]0)
              $writer.Write([UInt16]1)
              $writer.Write([UInt16]32)
              $writer.Write([UInt32]$frame.Bytes.Length)
              $writer.Write([UInt32]$offset)
              $offset += $frame.Bytes.Length
            }
            foreach ($frame in $frames) { $writer.Write([byte[]]$frame.Bytes) }
          } finally {
            $writer.Dispose()
            $stream.Dispose()
          }
          if (!(Test-Path $icon) -or (Get-Item $icon).Length -lt 10000) { throw 'Windows ICO generation failed.' }
          Write-Host "VERIFIED ANANDA WINDOWS ICO: $((Get-Item $icon).Length) bytes, $($frames.Count) resolutions"

      - name: Validate Electron shell and production version
        working-directory: src
        shell: powershell
        run: |
          node --check main.js
          node --check preload.js
          if (!(Test-Path 'installer.nsh')) { throw 'installer.nsh is missing.' }
          if (!(Test-Path 'index.html')) { throw 'index.html is missing.' }
          if (!(Test-Path 'logo-128.png')) { throw 'logo is missing.' }
          if (!(Test-Path 'ananda-icon.ico')) { throw 'Windows icon is missing.' }
          if ((Get-Content main.js -Raw) -notmatch "const APP_VERSION = '1\.0\.129';") { throw 'main.js is not version 1.0.129' }
          if ((Get-Content package.json -Raw) -notmatch '"version"\s*:\s*"1\.0\.129"') { throw 'package.json is not version 1.0.129' }
          if ((Get-Content package.json -Raw) -notmatch '"icon"\s*:\s*"ananda-icon\.ico"') { throw 'package.json does not use the Ananda Windows icon' }
          Write-Host 'ELECTRON SOURCE VALIDATION PASSED'

      - name: Install build dependencies
        working-directory: src
        run: npm install

      - name: Build real Windows Setup.exe
        working-directory: src
        run: npm run dist

      - name: Verify installer exists
        shell: powershell
        run: |
          $setup = 'src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe'
          $app = 'src/dist/win-unpacked/Ananda Sangha Event Desk.exe'
          if (!(Test-Path $setup)) { throw "Installer not created: $setup" }
          if (!(Test-Path $app)) { throw "Application executable not created: $app" }
          $size = (Get-Item $setup).Length
          $appSize = (Get-Item $app).Length
          if ($size -lt 50000000) { throw "Installer too small: $size bytes" }
          if ($appSize -lt 1000000) { throw "App executable too small: $appSize bytes" }
          Write-Host "VERIFIED INSTALLER: $size bytes"
          Write-Host "VERIFIED APP EXE: $appSize bytes"

      - name: Smoke test installer and Desktop shortcut
        shell: powershell
        run: |
          $setup = (Resolve-Path 'src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe').Path
          $desktop = [Environment]::GetFolderPath('Desktop')
          $shortcut = Join-Path $desktop 'Ananda Sangha Event Desk.lnk'
          if (Test-Path $shortcut) { Remove-Item $shortcut -Force }
          $process = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Silent installer returned exit code $($process.ExitCode)" }
          Start-Sleep -Seconds 3
          if (!(Test-Path $shortcut)) { throw "Desktop shortcut was not created: $shortcut" }
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut($shortcut)
          if (!$link.TargetPath -or !(Test-Path $link.TargetPath)) { throw "Desktop shortcut target is invalid: $($link.TargetPath)" }
          Add-Type -AssemblyName System.Drawing
          $exeIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($link.TargetPath)
          if ($null -eq $exeIcon) { throw 'Installed EXE has no extractable Windows icon.' }
          $exeIcon.Dispose()
          Write-Host "VERIFIED DESKTOP SHORTCUT: $shortcut"
          Write-Host "VERIFIED SHORTCUT TARGET: $($link.TargetPath)"
          Get-Process -Name 'Ananda Sangha Event Desk' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Create NGO handover folder
        shell: powershell
        run: |
          $root = Join-Path $PWD 'handover/ANANDA SANGHA EVENT DESK'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Installer'),(Join-Path $root 'Data'),(Join-Path $root 'Backup/Automatic'),(Join-Path $root 'Backup/Manual') | Out-Null
          Copy-Item 'src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe' (Join-Path $root 'Installer/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe') -Force
          Set-Content (Join-Path $root 'VERSION.txt') "ANANDA SANGHA EVENT DESK`r`nNGO PRODUCTION`r`nVersion 1.0.129 CLEAN`r`nWindows NSIS installer + uninstaller`r`nDesktop + Start Menu shortcut`r`nAnanda Windows icon embedded in EXE/installer/shortcut`r`nData preserved on uninstall`r`nAutomatic backup: every 5 days`r`nKeyboard: + Add/New | Alt+S Save | Esc Back" -Encoding utf8
          Set-Content (Join-Path $root 'README_START_HERE.txt') "1. Close any running Ananda Event Desk window.`r`n2. Open Installer.`r`n3. Run Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe over the existing installation.`r`n4. Do NOT delete Documents\ANANDA SANGHA EVENT DESK.`r`n5. Desktop and Start Menu shortcuts are created.`r`n6. NGO data/backups are retained." -Encoding utf8

      - name: Compress NGO handover
        shell: powershell
        run: Compress-Archive -Path 'handover/ANANDA SANGHA EVENT DESK' -DestinationPath 'ANANDA_SANGHA_EVENT_DESK_NGO_PRODUCTION_v1.0.129_CLEAN.zip' -CompressionLevel Optimal

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-Setup-v1.0.129-CLEAN
          path: src/dist/Ananda_Sangha_Event_Desk_Setup_v1.0.129.exe
          if-no-files-found: error

      - name: Upload complete NGO handover
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-NGO-Handover-v1.0.129-CLEAN
          path: ANANDA_SANGHA_EVENT_DESK_NGO_PRODUCTION_v1.0.129_CLEAN.zip
          if-no-files-found: error
