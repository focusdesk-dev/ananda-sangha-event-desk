name: Check-in Patch 8 Source Diagnosis
on:
  push:
    branches: [patch-5818-checkin-doubleclick-8]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://mirrors.huaweicloud.com/electron-builder-binaries/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install asar and app test dependencies
        shell: pwsh
        run: |
          npm install --no-fund --no-audit @electron/asar --no-save
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Download exact released 5.81.8 installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path base -Force | Out-Null
          gh release download ananda-beta-5.81.8 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir base
          if ($LASTEXITCODE -ne 0) { throw 'Original 5.81.8 download failed' }
      - name: Install 5.81.8 to isolated test folder
        shell: pwsh
        run: |
          $old=(Get-ChildItem base -Filter '*.exe' | Select-Object -First 1).FullName
          $dest=Join-Path $env:RUNNER_TEMP 'Ananda-5818-Patch-Target'
          $p=Start-Process -FilePath $old -ArgumentList @('/S',('/D='+$dest)) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Original installer failed' }
          if (!(Test-Path (Join-Path $dest 'resources/app.asar'))) { throw 'Original app.asar missing' }
          "ANANDA_PATCH_INSTALL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install required Check-In Patch 1 before building Typography Patch 2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch1 -Force | Out-Null
          gh release download ananda-beta-5.81.8-checkin-patch1 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch1
          if ($LASTEXITCODE -ne 0) { throw 'Required Check-In Patch 1 download failed' }
          $patch=(Get-ChildItem patch1 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Required Check-In Patch 1 failed' }
      - name: Install required Typography Patch 2 before building Header Patch 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch2 -Force | Out-Null
          gh release download ananda-beta-5.81.8-typography-patch2 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch2
          if ($LASTEXITCODE -ne 0) { throw 'Required Typography Patch 2 download failed' }
          $patch=(Get-ChildItem patch2 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Required Typography Patch 2 failed' }
      - name: Apply required Header Patch 3 before building Alignment Patch 4
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch3 -Force | Out-Null
          gh release download ananda-beta-5.81.8-header-patch3 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch3
          if ($LASTEXITCODE -ne 0) { throw 'Required Header Patch 3 download failed' }
          $patch=(Get-ChildItem patch3 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Required Header Patch 3 failed' }
      - name: Apply required Alignment Patch 4 before building Patch 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch4 -Force | Out-Null
          gh release download ananda-beta-5.81.8-action-patch4 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch4
          if ($LASTEXITCODE -ne 0) { throw 'Required Alignment Patch 4 download failed' }
          $patch=(Get-ChildItem patch4 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Required Alignment Patch 4 failed' }
      - name: Install verified Fresh Patch 5 before keyboard-only patch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch5 -Force | Out-Null
          gh release download ananda-beta-5.81.8-fresh-patch5 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch5
          if ($LASTEXITCODE -ne 0) { throw 'Fresh Patch 5 release download failed' }
          $patch=(Get-ChildItem patch5 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Fresh Patch 5 installation failed' }
          $current=(Get-FileHash (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar') -Algorithm SHA256).Hash
          if ($current -ne '42B01AF5726C7B6A6AB9B91ABF1148E76ED3F69341D2CD22085A1CB2091AB0F1') { throw 'Fresh Patch5 baseline mismatch' }
      - name: Apply verified Keyboard Focus Patch 5.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path keyboard -Force | Out-Null
          gh release download ananda-beta-5.81.8-keyboard-patch5-1 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir keyboard
          if ($LASTEXITCODE -ne 0) { throw 'Keyboard Patch 5.1 release download failed' }
          $patch=(Get-ChildItem keyboard -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Keyboard Focus Patch 5.1 install failed' }
          $current=(Get-FileHash (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar') -Algorithm SHA256).Hash
          if ($current -ne 'AE4D114DF4CD429CDCB4340826472FB708C31C0AB91EE2AC1BB4B156A06F2100') { throw 'Keyboard Patch 5.1 baseline mismatch' }
      - name: Install released Volunteer Patch 5.2 to verify exact working baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch52 -Force | Out-Null
          gh release download ananda-beta-5.81.8-volunteer-patch5-2 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch52
          if ($LASTEXITCODE -ne 0) { throw 'Existing Patch 5.2 release download failed' }
          $old=(Get-ChildItem patch52 -Filter '*.exe' | Select-Object -First 1).FullName
          $arguments=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $old -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Patch 5.2 baseline installation failed' }
          $actual=(Get-FileHash (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar') -Algorithm SHA256).Hash
          if ($actual -ne '2A925ACF5306DDE18499B96688E60D4F5783599E376FBEFC5FED291C1AE68CE0') { throw 'Unexpected Patch 5.2 baseline' }
      - name: Install verified Volunteer Patch 5.3 baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch53 -Force | Out-Null
          gh release download ananda-beta-5.81.8-volunteer-fix-patch5-3 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch53
          if ($LASTEXITCODE -ne 0) { throw 'Patch 5.3 baseline download failed' }
          $patch=(Get-ChildItem patch53 -Filter '*.exe' | Select-Object -First 1).FullName
          $argsPatch=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $argsPatch -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Patch 5.3 baseline install failed' }
          $actual=(Get-FileHash (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar') -Algorithm SHA256).Hash
          if ($actual -ne 'FEC945AF6352BF22BEDA9FB75CB21A28EF235AFD24D1E23D3F739993E00ED95D') { throw 'Unexpected Patch 5.3 baseline' }
      - name: Install verified cumulative Patch 5.4 baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path patch54 -Force | Out-Null
          gh release download ananda-beta-5.81.8-volunteer-fix-patch5-4 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir patch54
          if ($LASTEXITCODE -ne 0) { throw 'Verified Patch 5.4 download failed' }
          $patch=(Get-ChildItem patch54 -Filter '*.exe' | Select-Object -First 1).FullName
          $argsPatch=@('--quiet','--target',('"' + $env:ANANDA_PATCH_INSTALL_DIR + '"'))
          $p=Start-Process -FilePath $patch -ArgumentList $argsPatch -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Verified Patch 5.4 install failed' }
          $actual=(Get-FileHash (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar') -Algorithm SHA256).Hash
          if ($actual -ne 'C70E85DE8F35621EF91BD51FE40D1329F3BAEADDA14327A3599F483AED8F075E') { throw 'Unexpected Patch5.4 source archive' }
      - name: Inspect packaged volunteer check-in event handlers
        shell: pwsh
        run: |
          node scripts/debug-checkin8.js (Join-Path $env:ANANDA_PATCH_INSTALL_DIR 'resources/app.asar')
