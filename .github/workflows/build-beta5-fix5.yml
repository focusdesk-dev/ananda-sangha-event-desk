name: Build Phase 2 Windows Beta.5.5

on:
  workflow_dispatch:
  push:
    branches: [phase2-development]

jobs:
  build-windows-beta5fix5:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Phase 2 source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild verified beta.4C base
        shell: powershell
        run: |
          @'
          import base64,gzip,pathlib
          source=pathlib.Path('src/build-beta4c-ci.ps1.gz.b64')
          encoded=''.join(source.read_text(encoding='utf-8').split()).rstrip('=');encoded+='='*(-len(encoded)%4)
          pathlib.Path('beta4c-ci.ps1').write_bytes(gzip.decompress(base64.b64decode(encoded,validate=False)))
          '@ | Set-Content restore_ci.py -Encoding utf8
          python restore_ci.py
          if($LASTEXITCODE -ne 0){throw 'Could not restore beta.4C CI script'}
          Remove-Item restore_ci.py -Force
          & .\beta4c-ci.ps1
          if($LASTEXITCODE -ne 0){throw 'beta.4C base build/test failed'}
      - name: Apply exact beta.5 batch page
        shell: powershell
        run: |
          @'
          import base64,gzip,pathlib
          parts=sorted(pathlib.Path('src').glob('build-beta5-batch-page.py.gz.b64.part*'))
          if len(parts)!=4: raise SystemExit(f'Expected 4 beta.5 builder parts, found {len(parts)}')
          encoded=''.join(''.join(p.read_text(encoding='utf-8').split()) for p in parts).rstrip('=');encoded+='='*(-len(encoded)%4)
          pathlib.Path('src/build-beta5-batch-page.py').write_bytes(gzip.decompress(base64.b64decode(encoded,validate=False)))
          '@ | Set-Content restore_beta5.py -Encoding utf8
          python restore_beta5.py
          if($LASTEXITCODE -ne 0){throw 'Could not restore beta.5 builder'}
          Remove-Item restore_beta5.py -Force
          python src/build-beta5-batch-page.py
          if($LASTEXITCODE -ne 0){throw 'beta.5 patch failed'}
      - name: Apply beta.5.1 corrections
        shell: powershell
        run: |
          python src/build-beta5-fix1.py
          if($LASTEXITCODE -ne 0){throw 'beta.5.1 patch failed'}
      - name: Apply beta.5.2 corrections
        shell: powershell
        run: |
          python src/build-beta5-fix2.py
          if($LASTEXITCODE -ne 0){throw 'beta.5.2 patch failed'}
      - name: Apply beta.5.3 corrections
        shell: powershell
        run: |
          python src/build-beta5-fix3.py
          if($LASTEXITCODE -ne 0){throw 'beta.5.3 patch failed'}
      - name: Apply beta.5.4 corrections
        shell: powershell
        run: |
          @'
          from pathlib import Path
          p=Path('src/build-beta5-fix4.py')
          s=p.read_text(encoding='utf-8')
          bad="required=['PHASE2 BETA5 FIX4','Student Progress List','Follow-up & Outreach','Annual Class Summary','Admin approval required','All\\',\\'Joined\\',\\'Eligible\\',\\'Not Eligible','export the filtered Batch Report','p2v54NextStatus']"
          good="required=['PHASE2 BETA5 FIX4','Student Progress List','Follow-up & Outreach','Annual Class Summary','Admin approval required','Joined','Eligible','Not Eligible','export the filtered Batch Report','p2v54NextStatus']"
          if bad in s:p.write_text(s.replace(bad,good),encoding='utf-8')
          '@ | Set-Content repair_fix4.py -Encoding utf8
          python repair_fix4.py
          if($LASTEXITCODE -ne 0){throw 'Could not prepare beta.5.4 builder'}
          Remove-Item repair_fix4.py -Force
          python src/build-beta5-fix4.py
          if($LASTEXITCODE -ne 0){throw 'beta.5.4 patch failed'}
      - name: Apply beta.5.5 corrections
        shell: powershell
        run: |
          python src/build-beta5-fix5.py
          if($LASTEXITCODE -ne 0){throw 'beta.5.5 patch failed'}
          @'
          import json,pathlib
          p=pathlib.Path('src/package.json');d=json.loads(p.read_text(encoding='utf-8'));d['version']='2.0.0-beta.5.5';p.write_text(json.dumps(d,indent=2)+'\n',encoding='utf-8')
          '@ | Set-Content set_beta55_version.py -Encoding utf8
          python set_beta55_version.py
          if($LASTEXITCODE -ne 0){throw 'Could not set beta.5.5 version'}
          Remove-Item set_beta55_version.py -Force
      - name: Validation pass 1 - syntax and all previous fixes
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re
          html=Path('src/index.html').read_text(encoding='utf-8')
          required=['PHASE2 BETA5 FIX1','PHASE2 BETA5 FIX2','PHASE2 BETA5 FIX3','PHASE2 BETA5 FIX4','PHASE2 BETA5 FIX5','MARK REMAINING ABSENT','p2v5Fix2OpenDateDialog','p2v53MigrateClassOnlyStudents','End Batch Summary','Student Progress List','p2v55ProgressionRequirement']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing beta.5.5 markers: '+repr(missing))
          m=re.search(r'<script>(.*?)</script>',html,re.S|re.I)
          if not m: raise SystemExit('Main app script not found')
          Path('beta55-main-check.js').write_text(m.group(1),encoding='utf-8')
          '@ | Set-Content validate_beta55.py -Encoding utf8
          python validate_beta55.py
          if($LASTEXITCODE -ne 0){throw 'beta.5.5 source validation failed'}
          node --check beta55-main-check.js
          if($LASTEXITCODE -ne 0){throw 'beta.5.5 main script syntax failed'}
          node --check src/main.js
          if($LASTEXITCODE -ne 0){throw 'Electron main.js syntax failed'}
          node --check src/preload.js
          if($LASTEXITCODE -ne 0){throw 'Electron preload.js syntax failed'}
          Remove-Item validate_beta55.py,beta55-main-check.js -Force
      - name: Validation pass 2 - exact post-5.4 corrections
        shell: powershell
        run: |
          @'
          from pathlib import Path
          html=Path('src/index.html').read_text(encoding='utf-8')
          start=html.find('// PHASE2 BETA5 FIX5');end=html.find('\n\n    updateBackButton();',start);block=html[start:end]
          checks={
            'custom class':['+ Custom Class','CUSTOM CLASS NAME','category:\'Other\''],
            'course fee':['COURSE FEE (₹)','courseFee:','Fee: ₹'],
            'clean batch modal':["status.closest('.field').style.display='none'","sessions.closest('.field').style.display='none'","generate.closest('.field').style.display='none'"],
            'clean course labels':['o.textContent=c.name'],
            'automatic status':['p2v55AutoStatus','now<start','now<=end'],
            'keyboard suggestions':['ArrowDown','ArrowUp',"ev.key==='Enter'",'p2v55-key-active'],
            'three months row':['grid-template-columns:repeat(3','p2v55MonthOpen','p2v55-month-dates'],
            'clean header':['Acharya:','Fee: ₹'],
            'attendance scroll':['p2v55AttendanceViewport','scrollLeft=pos.left','p2cSelectedEnrollmentId'],
            'progression central':['p2v55ProgressionRequirement','p2v55CreateEnrollmentBase','if(!check.ok&&!override)','Previous level not completed'],
          }
          for name,items in checks.items():
            missing=[x for x in items if x not in block]
            if missing: raise SystemExit(f'{name} missing: {missing}')
          forbidden=['Attendance by Date','Assisting Volunteers:','Frequency:','>Not marked</span>']
          for x in forbidden:
            if x in block: raise SystemExit('Removed UI text still in beta.5.5 override: '+x)
          '@ | Set-Content guard_beta55.py -Encoding utf8
          python guard_beta55.py
          if($LASTEXITCODE -ne 0){throw 'beta.5.5 behavior guard failed'}
      - name: Validation pass 3 - progression regression test
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re
          html=Path('src/index.html').read_text(encoding='utf-8')
          m=re.search(r'function p2v55EligibilityFromHistory\(level,history\)\{[^\n]+?\}',html)
          if not m: raise SystemExit('Could not extract real eligibility helper')
          src="const p2Levels=['Level 1','Level 2','Level 3','Level 4'];\n"+m.group(0)+"\n"+r'''
          function check(value,label){if(!value){console.error('FAILED:',label);process.exit(2)}}
          check(p2v55EligibilityFromHistory('Level 1',[])===true,'Level 1 needs no prior level');
          check(p2v55EligibilityFromHistory('Level 2',[{level:'Level 1',outcome:'Did Not Complete'}])===false,'ineligible L1 must not enter L2');
          check(p2v55EligibilityFromHistory('Level 2',[{level:'Level 1',outcome:'Completed'}])===true,'completed L1 may enter L2');
          check(p2v55EligibilityFromHistory('Level 3',[{level:'Level 1',outcome:'Completed'}])===false,'Divya regression: L1 alone must not enter L3');
          check(p2v55EligibilityFromHistory('Level 3',[{level:'Level 2',outcome:'Enrolled'}])===false,'enrolled L2 is not completed L2');
          check(p2v55EligibilityFromHistory('Level 3',[{level:'Level 2',outcome:'Completed'}])===true,'completed L2 may enter L3');
          check(p2v55EligibilityFromHistory('Level 4',[{level:'Level 2',outcome:'Completed'}])===false,'L4 needs completed L3');
          check(p2v55EligibilityFromHistory('Level 4',[{level:'Level 3',outcome:'Completed'}])===true,'completed L3 may enter L4');
          console.log('PROGRESSION REGRESSION TESTS PASSED');
          '''
          Path('beta55-progression-test.js').write_text(src,encoding='utf-8')
          '@ | Set-Content make_progression_test.py -Encoding utf8
          python make_progression_test.py
          if($LASTEXITCODE -ne 0){throw 'Could not build progression regression test'}
          node beta55-progression-test.js
          if($LASTEXITCODE -ne 0){throw 'Progression regression test failed'}
          Remove-Item make_progression_test.py,beta55-progression-test.js -Force
      - name: Build beta.5.5 Windows x64 installer
        shell: powershell
        run: |
          Remove-Item src\dist -Recurse -Force -ErrorAction SilentlyContinue
          Push-Location src
          npm run dist
          if($LASTEXITCODE -ne 0){throw 'beta.5.5 electron-builder failed'}
          Pop-Location
          $setup='src\dist\Ananda_Sangha_Event_Desk_Phase2_Setup_v2.0.0-beta.5.5.exe'
          if(!(Test-Path $setup)){throw 'beta.5.5 Setup.exe missing'}
      - name: Validation pass 4 - real install, overwrite, shortcut and launch
        shell: powershell
        run: |
          $setup=(Resolve-Path 'src\dist\Ananda_Sangha_Event_Desk_Phase2_Setup_v2.0.0-beta.5.5.exe').Path
          $proc=Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if($proc.ExitCode -ne 0){throw "beta.5.5 silent installer failed with exit code $($proc.ExitCode)"}
          Start-Sleep -Seconds 2
          $programs=Join-Path $env:LOCALAPPDATA 'Programs'
          $app=Get-ChildItem $programs -Filter 'Ananda Sangha Event Desk.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if(!$app){throw 'Installed app not found'}
          $shortcut=Join-Path ([Environment]::GetFolderPath('Desktop')) 'Ananda Sangha Event Desk.lnk'
          if(!(Test-Path $shortcut)){throw 'Desktop shortcut not found'}
          $docs=[Environment]::GetFolderPath('MyDocuments')
          $latest=Join-Path $docs 'ANANDA SANGHA EVENT DESK\Installer\Ananda_Sangha_Event_Desk_Setup_Latest.exe'
          if(!(Test-Path $latest)){throw 'Stored latest installer copy not found'}
          if((Get-FileHash $setup -Algorithm SHA256).Hash -ne (Get-FileHash $latest -Algorithm SHA256).Hash){throw 'Stored latest installer mismatch'}
          $asar=Join-Path $app.Directory.FullName 'resources\app.asar';$env:BETA55_ASAR=$asar
          @'
          const asar=require('./src/node_modules/@electron/asar');
          const html=asar.extractFile(process.env.BETA55_ASAR,'index.html').toString('utf8');
          for(const x of ['PHASE2 BETA5 FIX1','PHASE2 BETA5 FIX2','PHASE2 BETA5 FIX3','PHASE2 BETA5 FIX4','PHASE2 BETA5 FIX5','p2v55ProgressionRequirement','+ Custom Class','COURSE FEE (₹)','p2v55AttendanceViewport']){if(!html.includes(x)){console.error('Missing installed marker',x);process.exit(2)}}
          '@ | Set-Content verify_installed_beta55.js -Encoding utf8
          node verify_installed_beta55.js
          if($LASTEXITCODE -ne 0){throw 'Installed app is not beta.5.5'}
          Remove-Item verify_installed_beta55.js -Force
          $run=Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 7
          if($run.HasExited){throw "Installed beta.5.5 app exited during launch test (exit $($run.ExitCode))"}
          Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue
      - name: Upload Phase 2 beta.5.5 Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-Phase2-Setup-v2.0.0-beta.5.5
          path: src/dist/Ananda_Sangha_Event_Desk_Phase2_Setup_v2.0.0-beta.5.5.exe
          if-no-files-found: error
