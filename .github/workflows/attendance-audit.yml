name: Audit existing attendance semantics
on:
  push:
    branches: [patch14-12-unified-attendance-entry-20261120]
    paths: ['.github/workflows/attendance-audit.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract only relevant code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text().splitlines()
          picks=[]
          for i,l in enumerate(s):
            if any(q in l for q in ("p2v58CurrentRows =","function p2v58CurrentRows","p2v58Draft=","p2v524ScanSession","p2v58Date=","p2v58CurrentBatch=","function p2v58CurrentBatch","p2v538FullClassRows","p2v536RenderFullRoster","confidence","p2v58RenderRoster=function","p2v58RenderRoster =","p2v528RenderRoster","p2v58CurrentRows=function","p2v58DateChange")):
              picks.append(i)
          nums=set()
          for i in picks:
            for j in range(max(0,i-2),min(len(s),i+5)):nums.add(j)
          out=[f"LINES:{len(s)} MATCHES:{len(picks)}"]
          for i in sorted(nums):
            if i<9800:
              out.append(f"{i+1:05} "+s[i][:700])
          Path("attendance-audit.txt").write_text("\n".join(out)[:180000])
          PY
      - name: Save audit
        run: |
          git config user.name "Ananda QA"
          git config user.email "actions@users.noreply.github.com"
          git add attendance-audit.txt
          git commit -m "Inspect attendance implementation for narrow patch"
          git push
