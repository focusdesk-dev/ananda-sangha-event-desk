name: Validate generated beta4 source

on:
  push:
    branches: [phase2-beta4-work]

jobs:
  validate-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild beta3 source
        shell: powershell
        run: |
          @'
          import base64,gzip,pathlib,binascii
          parts=sorted(pathlib.Path('assets').glob('index.html.gz.b64.part*'))
          raw=base64.b64decode(b''.join(b''.join(p.read_bytes().split()) for p in parts),validate=True)
          html=gzip.decompress(raw)
          if len(html)!=488870 or (binascii.crc32(html)&0xffffffff)!=0x41243984: raise SystemExit('base mismatch')
          pathlib.Path('src/index.html').write_bytes(html)
          '@ | Set-Content restore_base.py -Encoding utf8
          python restore_base.py
          @'
          from pathlib import Path
          p=Path('src/build-clean129.py');b=p.read_bytes()
          b=b.replace(b'expected_size = 491414',b'expected_size = 491328')
          b=b.replace(b'expected_crc = 0xed7c3111',b'expected_crc = 0x1484eb85')
          b=b.replace(b"expected_sha = '4737255254f9f1d0951f5365944049d15c4c97434c1be16fbb8ed394bcaf72d9'",b"expected_sha = '390a75590e7fc0cd0f0199295bd684d830f96656ced48cc0789c0c9c037bd113'")
          p.write_bytes(b)
          '@ | Set-Content fix_phase1.py -Encoding utf8
          python fix_phase1.py
          python src/build-clean129.py
          @'
          import base64,gzip,pathlib
          source=pathlib.Path('src/build-phase2.py.gz.b64')
          encoded=''.join(source.read_text(encoding='utf-8').split()).rstrip('=');encoded+='='*(-len(encoded)%4)
          script=gzip.decompress(base64.b64decode(encoded,validate=False)).decode('utf-8')
          for line in ["if len(raw)!=expected_size: raise SystemExit(f'Phase 2 HTML size mismatch: {len(raw)}')\n","if (binascii.crc32(raw)&0xffffffff)!=expected_crc: raise SystemExit('Phase 2 CRC mismatch')\n","if hashlib.sha256(raw).hexdigest()!=expected_sha: raise SystemExit('Phase 2 SHA mismatch')\n"]: script=script.replace(line,'')
          pathlib.Path('src/build-phase2.py').write_text(script,encoding='utf-8',newline='\n')
          '@ | Set-Content restore_phase2.py -Encoding utf8
          python restore_phase2.py
          python src/build-phase2.py
          @'
          import base64,gzip,pathlib
          parts=sorted(pathlib.Path('src').glob('build-beta2-patch.py.gz.b64.part*'))
          encoded=''.join(''.join(p.read_text(encoding='utf-8').split()) for p in parts).rstrip('=');encoded+='='*(-len(encoded)%4)
          pathlib.Path('src/build-beta2-patch.py').write_bytes(gzip.decompress(base64.b64decode(encoded,validate=False)))
          '@ | Set-Content restore_beta2.py -Encoding utf8
          python restore_beta2.py
          python src/build-beta2-patch.py
          python src/build-beta3-classes.py
          python src/set-beta3-version.py

      - name: Apply and validate beta4 source
        shell: powershell
        run: |
          python src/build-beta4.py
          python src/set-beta4-version.py
          @'
          import pathlib,re,hashlib,binascii
          p=pathlib.Path('src/index.html');b=p.read_bytes();text=b.decode('utf-8')
          required=['2.0.0-beta.4','Classes by Year','Double-click a year','Open-ended / dates announced later','p2AddClassDate','p2NextClass','p2AttendanceGridSearch','p2-attendance-grid','p2EnrollmentPeople','Also add/link to Student Master','Search Student, Volunteer, Attendee or Kriyaban','p2SessionModal']
          for m in required:
              if m not in text: raise SystemExit('Missing beta4 marker: '+m)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if len(scripts)!=10: raise SystemExit(f'Unexpected script count: {len(scripts)}')
          out=pathlib.Path('script-check');out.mkdir(exist_ok=True)
          for i,s in enumerate(scripts):(out/f'script-{i:02d}.js').write_text(s,encoding='utf-8')
          print('BETA4 HTML',len(b),'CRC32',format(binascii.crc32(b)&0xffffffff,'08x'),'SHA256',hashlib.sha256(b).hexdigest())
          '@ | Set-Content validate_beta4.py -Encoding utf8
          python validate_beta4.py
          Get-ChildItem 'script-check\*.js' | ForEach-Object { node --check $_.FullName }
          node --check src/main.js
          node --check src/preload.js
          if((Get-Content src/main.js -Raw) -notmatch "const APP_VERSION = '2\.0\.0-beta\.4';"){throw 'main.js beta4 version mismatch'}
          if((Get-Content src/package.json -Raw) -notmatch '"version"\s*:\s*"2\.0\.0-beta\.4"'){throw 'package beta4 version mismatch'}
          Write-Host 'BETA4 SOURCE VALIDATION PASSED'

      - name: Upload generated beta4 HTML
        uses: actions/upload-artifact@v4
        with:
          name: generated-beta4-html
          path: src/index.html
          if-no-files-found: error
