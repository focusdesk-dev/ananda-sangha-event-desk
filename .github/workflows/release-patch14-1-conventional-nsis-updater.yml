name: PATCH14.1 Conventional Code-Only Windows EXE Installer
on:
  push:
    branches: [patch14-1-nsis-update-installer-20261117]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-validate:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_ASAR_SHA: 24F788CED0E3616EDAA52A1A6566BA0B58CAD6555CE34D09A00087E525E1A4EC
      PATCH13_ASAR_SHA: 70F3424BEBCC9434D9D54B678EC69677A50C21A30BD7A0FFDC69EB4EE11BFC7F
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download tested Patch14.1 application archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path payload,prior,base,dist-patch14-1 | Out-Null
          gh release download ananda-5.81.8-patch14-1-add-member-update --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.zip' --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'Verified Patch14.1 release missing' }
          $zip=(Get-ChildItem payload -Filter '*.zip' | Select-Object -First 1).FullName
          Expand-Archive -LiteralPath $zip -DestinationPath payload -Force
          $sha=(Get-FileHash payload/app.asar -Algorithm SHA256).Hash
          Write-Host 'RELEASED_APPROVED_PATCH14_1_ASAR:' $sha
          if($sha -ne $env:APPROVED_ASAR_SHA){throw 'Released application code mismatch'}
      - name: Install conventional NSIS build tool
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if($LASTEXITCODE -ne 0){throw 'NSIS installer compiler unavailable'}
          if(!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')){throw 'NSIS compiler missing'}
      - name: Build small standard Windows updater containing verified ASAR only
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\NSIS\makensis.exe' '/V4' 'Patch14-1-Standard-Update.nsi'
          if($LASTEXITCODE -ne 0){throw 'Standard NSIS build failed'}
          $exe='dist-patch14-1/Ananda-Patch14.1-ADD-MEMBER-Installer.exe'
          if(!(Test-Path $exe)){throw 'Windows updater EXE missing'}
          Write-Host 'NSIS_SETUP_SHA256:' (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host 'NSIS_SETUP_BYTES:' (Get-Item $exe).Length
          Write-Host 'SIGNATURE:' (Get-AuthenticodeSignature $exe).Status
      - name: Build test machine with real existing Patch13 installation and saved data
        shell: pwsh
        run: |
          gh release download ananda-beta-5.81.8 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir base
          if($LASTEXITCODE -ne 0){throw 'Original full Ananda setup missing'}
          gh release download ananda-beta-5.81.8-student-volunteer-mobile-patch13 --repo focusdesk-dev/ananda-sangha-event-desk --pattern '*.exe' --dir prior
          if($LASTEXITCODE -ne 0){throw 'Verified Patch13 source missing'}
          $base=(Get-ChildItem base -Filter '*.exe' | Select-Object -First 1).FullName
          $old=(Get-ChildItem prior -Filter '*.exe' | Select-Object -First 1).FullName
          $dest=Join-Path $env:RUNNER_TEMP 'AnandaPatch141StandardUpdateTest'
          $p=Start-Process -FilePath $base -ArgumentList @('/S',('/D='+$dest)) -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Original Ananda setup failed'}
          $asm=[Reflection.Assembly]::LoadFrom($old)
          $resource=$asm.GetManifestResourceStream('AnandaPatchArchive')
          if(!$resource){throw 'Verified Patch13 archive not found'}
          $gzip=[IO.Compression.GZipStream]::new($resource,[IO.Compression.CompressionMode]::Decompress)
          $f=[IO.File]::Create((Join-Path $dest 'resources/app.asar'))
          try{$gzip.CopyTo($f)}finally{$f.Close();$gzip.Close();$resource.Close()}
          $sha=(Get-FileHash (Join-Path $dest 'resources/app.asar') -Algorithm SHA256).Hash
          if($sha -ne $env:PATCH13_ASAR_SHA){throw 'Test install differs from released Patch13'}
          "ANANDA_TEST_INSTALL=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $data=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'ANANDA SANGHA EVENT DESK/Data'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          [IO.File]::WriteAllText((Join-Path $data 'patch14-1-sentinel.txt'),'Original Ananda records must survive')
          Write-Host 'PASS existing Patch13 app installed'
      - name: Execute updater EXE on existing Ananda and verify backup, payload and data
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist-patch14-1/Ananda-Patch14.1-ADD-MEMBER-Installer.exe').Path
          $dest=$env:ANANDA_TEST_INSTALL
          $p=Start-Process -FilePath $exe -ArgumentList @('/S',('/D='+$dest)) -PassThru
          if(!$p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'Updater did not complete within 90 seconds (silent dialog or wrong installed source)' }
          Write-Host 'UPDATER_EXIT_CODE:' $p.ExitCode
          if($p.ExitCode -ne 0){throw 'Patch14.1 updater did not complete'}
          $archive=Join-Path $dest 'resources/app.asar'
          $backup=Join-Path $dest 'resources/app.asar.before-patch14-1'
          if(!(Test-Path $backup)){throw 'Previous version not backed up'}
          $new=(Get-FileHash $archive -Algorithm SHA256).Hash
          $old=(Get-FileHash $backup -Algorithm SHA256).Hash
          Write-Host 'INSTALLED_ASAR_SHA:' $new
          Write-Host 'BACKUP_SHA:' $old
          if($new -ne $env:APPROVED_ASAR_SHA){throw 'Installed code is not approved Patch14.1'}
          if($old -ne $env:PATCH13_ASAR_SHA){throw 'Previous version backup altered'}
          $marker=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'ANANDA SANGHA EVENT DESK/Data/patch14-1-sentinel.txt'
          if([IO.File]::ReadAllText($marker) -ne 'Original Ananda records must survive'){throw 'User data modified'}
          Write-Host 'PASS single EXE updates Ananda and preserves previous code and user data'
      - name: Retest saved family Add Member and all frozen workflows
        shell: pwsh
        run: |
          $app=Join-Path $env:ANANDA_TEST_INSTALL 'Ananda Sangha Event Desk.exe'
          $p=Start-Process -FilePath $app -ArgumentList '--remote-debugging-port=9223' -PassThru
          Start-Sleep -Seconds 6
          if($p.HasExited){throw 'Updated Ananda desktop failed to open'}
          node scripts/verify-patch14-existing-family-desktop.js
          if($LASTEXITCODE -ne 0){throw 'Patch14.1 saved-family regression'}
          node scripts/verify-patch13-student-volunteer-and-mobile-desktop.js
          if($LASTEXITCODE -ne 0){throw 'Student Progress or duplicate phone regression'}
          node scripts/verify-patch12-register-under-desktop.js
          if($LASTEXITCODE -ne 0){throw 'Registration freeze regression'}
          node scripts/verify-prior-freezes-patch11-desktop.js
          if($LASTEXITCODE -ne 0){throw 'Previously approved UI regression'}
          node scripts/verify-volunteer-cross-event-desktop.js
          if($LASTEXITCODE -ne 0){throw 'Cross-event volunteer regression'}
          Write-Host 'PASS full Windows app UI tests after updater EXE'
      - name: Scan exact finished updater EXE using Microsoft Defender
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist-patch14-1/Ananda-Patch14.1-ADD-MEMBER-Installer.exe').Path
          $state=Get-MpComputerStatus -ErrorAction Stop
          if(!$state.AntivirusEnabled){throw 'Defender scanner unavailable'}
          try{Update-MpSignature -ErrorAction Stop}catch{Write-Host 'Signature update not available:' $_.Exception.Message}
          Write-Host 'DEFENDER_SIGNATURE_VERSION:' (Get-MpComputerStatus).AntivirusSignatureVersion
          Start-MpScan -ScanType CustomScan -ScanPath $exe -ErrorAction Stop
          $hits=@(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object{($_.Resources -join ';') -match 'Ananda-Patch14.1-ADD-MEMBER-Installer.exe'})
          if($hits.Count -gt 0){throw 'Microsoft Defender detected Patch14.1 setup'}
          if(!(Test-Path $exe)){throw 'Defender quarantined updater'}
          Write-Host 'PASS no Defender detections on exact standard updater EXE'
      - uses: actions/upload-artifact@v4
        with:
          name: ananda-patch14-1-standard-updater-exe
          path: dist-patch14-1/Ananda-Patch14.1-ADD-MEMBER-Installer.exe
          if-no-files-found: error
          compression-level: 0
  clamav:
    needs: windows-validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ananda-patch14-1-standard-updater-exe
          path: audit
      - name: Install latest independent antivirus definitions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --verbose
          clamscan --version
      - name: Scan exactly finished updater EXE with no exceptions
        run: |
          test -s audit/Ananda-Patch14.1-ADD-MEMBER-Installer.exe
          clamscan --infected --allmatch --max-filesize=200M --max-scansize=500M audit/Ananda-Patch14.1-ADD-MEMBER-Installer.exe
          echo 'PASS independent ClamAV scan of Windows updater'
  release:
    needs: [windows-validate,clamav]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ananda-patch14-1-standard-updater-exe
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ananda-5.81.8-patch14-1-standard-exe
          name: Ananda Patch14.1 - Windows Updater EXE
          prerelease: true
          files: release/Ananda-Patch14.1-ADD-MEMBER-Installer.exe
          body: |
            One-click Windows update for your existing installed Ananda Sangha Event Desk.
            Standard NSIS setup including only the previously tested Patch14.1 app.asar,
            not any previously antivirus-flagged Electron executable or custom C# patcher.
            Close Ananda, run the EXE, select the existing installed application folder if needed,
            click Install. Existing app.asar backed up, Documents data unchanged.
            Patch13 or previous data-only Patch14 installed code is required.
            All frozen class, event, mobile duplicate and saved-family Add Member Windows UI tests
            and Microsoft Defender + ClamAV scans must pass before release.
            UNSIGNED: If Windows or Chrome blocks this file, do not bypass protection.
