name: Inspect Phase 2 Beta 5.14 fixes

on:
  workflow_dispatch:
  push:
    branches: [phase2-beta514-fixes]

jobs:
  build-windows-beta514:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild verified beta 4C base
        shell: powershell
        run: |
          @'
          import base64,gzip,pathlib
          source=pathlib.Path('src/build-beta4c-ci.ps1.gz.b64')
          encoded=''.join(source.read_text(encoding='utf-8').split()).rstrip('=')
          encoded+='='*(-len(encoded)%4)
          pathlib.Path('beta4c-ci.ps1').write_bytes(gzip.decompress(base64.b64decode(encoded,validate=False)))
          '@ | Set-Content restore_ci.py -Encoding utf8
          python restore_ci.py
          if($LASTEXITCODE -ne 0){throw 'Could not restore beta 4C CI script'}
          Remove-Item restore_ci.py -Force

          @'
          from pathlib import Path
          p=Path('beta4c-ci.ps1')
          s=p.read_text(encoding='utf-8-sig')
          needle='SILENT INSTALL / OVERWRITE / SHORTCUT / LAUNCH SMOKE TEST'
          pos=s.upper().find(needle)
          if pos < 0: raise SystemExit('Could not locate beta 4C smoke-test section')
          cut=s.rfind('\n',0,pos)+1
          s=s[:cut]+'Write-Host "=== BETA.4C BASE READY FOR BETA.5.11 BUILD ==="\nexit 0\n'
          p.write_text(s,encoding='utf-8')
          '@ | Set-Content trim_beta4c_smoke.py -Encoding utf8
          python trim_beta4c_smoke.py
          if($LASTEXITCODE -ne 0){throw 'Could not trim beta 4C runner-only smoke test'}
          Remove-Item trim_beta4c_smoke.py -Force
          & .\beta4c-ci.ps1
          if($LASTEXITCODE -ne 0){throw 'beta 4C base build failed'}

      - name: Apply beta 5 base page
        shell: powershell
        run: |
          @'
          import base64,gzip,pathlib
          parts=sorted(pathlib.Path('src').glob('build-beta5-batch-page.py.gz.b64.part*'))
          if len(parts)!=4: raise SystemExit(f'Expected 4 beta 5 builder parts, found {len(parts)}')
          encoded=''.join(''.join(p.read_text(encoding='utf-8').split()) for p in parts).rstrip('=')
          encoded+='='*(-len(encoded)%4)
          pathlib.Path('src/build-beta5-batch-page.py').write_bytes(gzip.decompress(base64.b64decode(encoded,validate=False)))
          '@ | Set-Content restore_beta5.py -Encoding utf8
          python restore_beta5.py
          if($LASTEXITCODE -ne 0){throw 'Could not restore beta 5 builder'}
          Remove-Item restore_beta5.py -Force
          python src/build-beta5-batch-page.py
          if($LASTEXITCODE -ne 0){throw 'beta 5 base page patch failed'}

      - name: Apply beta 5.1 through beta 5.6
        shell: powershell
        run: |
          python src/build-beta5-fix1.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.1 failed'}
          python src/build-beta5-fix2.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.2 failed'}
          python src/build-beta5-fix3.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.3 failed'}
          @'
          from pathlib import Path
          p=Path('src/build-beta5-fix4.py')
          s=p.read_text(encoding='utf-8')
          bad="required=['PHASE2 BETA5 FIX6','PHASE2 BETA56 CHAT FINAL','PHASE2 BETA57 REFINE','PHASE2 BETA58 ATTENDANCE QR','PHASE2 BETA59 ATTENDANCE FINAL','PHASE2 BETA510 CURRENT APPROVED','PHASE2 BETA511 COMPLETE','PHASE2 BETA512 ACTIVE CLASSES FIX','classAttendanceHub','classReportsHub','MARK REMAINING ABSENT','p2v510EventLanding','p2v510ClassYear','UPDATE ATTENDANCE','SCAN TO UPLOAD','REVIEW DETECTED ATTENDANCE','P2V511_QR_DOC','BATCH WISE','STUDENT WISE']"
          good="required=['PHASE2 BETA5 FIX4','Student Progress List','Follow-up & Outreach','Annual Class Summary','Admin approval required','Joined','Eligible','Not Eligible','export the filtered Batch Report','p2v54NextStatus']"
          if bad in s: p.write_text(s.replace(bad,good),encoding='utf-8')
          '@ | Set-Content repair_fix4.py -Encoding utf8
          python repair_fix4.py
          Remove-Item repair_fix4.py -Force
          python src/build-beta5-fix4.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.4 failed'}
          python src/build-beta5-fix5.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.5 failed'}
          python src/build-beta5-fix6.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.6 failed'}

      - name: Apply decisions from 05 Oct 18:42 onward
        shell: powershell
        run: |
          python src/build-beta56-chat.py
          if($LASTEXITCODE -ne 0){throw 'Beta 5.6 chat patch failed'}
          python src/build-beta57-refine.py
          if($LASTEXITCODE -ne 0){throw 'Beta 5.7 refinement failed'}
          python src/build-beta58-attendance-qr.py
          if($LASTEXITCODE -ne 0){throw 'Beta 5.9 attendance patch failed'}
          python src/build-beta510-current.py
          if($LASTEXITCODE -ne 0){throw 'Beta 5.10 approved-flow patch failed'}
          python src/build-beta511-complete.py
          if($LASTEXITCODE -ne 0){throw 'Beta 5.11 complete patch failed'}

      - name: Repair legacy v125 style literal
        shell: powershell
        run: |
          @'
          from pathlib import Path
          p=Path('src/index.html')
          s=p.read_text(encoding='utf-8')
          prefix="document.head.insertAdjacentHTML('beforeend','"
          start=s.find(prefix+"<style>.v125-keyhint")
          if start < 0: raise SystemExit('Legacy v125 style block not found')
          content_start=start+len(prefix)
          close=s.find("</style>');",content_start)
          if close < 0: raise SystemExit('Legacy v125 style block end not found')
          content_end=close+len('</style>')
          inner=s[content_start:content_end]
          inner=inner.replace('`','\\`').replace('${','\\${')
          fixed="document.head.insertAdjacentHTML('beforeend',`"+inner+"`);"
          end=close+len("</style>');")
          p.write_text(s[:start]+fixed+s[end:],encoding='utf-8')
          print('Legacy v125 style block converted to a template literal')
          '@ | Set-Content repair_legacy_js.py -Encoding utf8
          python repair_legacy_js.py
          if($LASTEXITCODE -ne 0){throw 'Legacy JS repair failed'}
          Remove-Item repair_legacy_js.py -Force

      - name: Install offline QR libraries
        shell: powershell
        run: |
          Push-Location src
          npm install qrcode@1.5.4 jsqr@1.4.0 browserify@17.0.1 --save-dev --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Could not install offline QR libraries'}
          @'
          module.exports = require('qrcode');
          '@ | Set-Content qrcode-entry.js -Encoding utf8
          @'
          module.exports = require('jsqr');
          '@ | Set-Content jsqr-entry.js -Encoding utf8
          npx browserify qrcode-entry.js --standalone QRCode -o qrcode-client.js
          if($LASTEXITCODE -ne 0 -or !(Test-Path 'qrcode-client.js')){throw 'Could not bundle QRCode for offline renderer'}
          npx browserify jsqr-entry.js --standalone jsQR -o jsqr-client.js
          if($LASTEXITCODE -ne 0 -or !(Test-Path 'jsqr-client.js')){throw 'Could not bundle jsQR for offline renderer'}
          Remove-Item qrcode-entry.js,jsqr-entry.js -Force
          Pop-Location

      - name: Create approved app and installer artwork
        shell: powershell
        run: |
          python -m pip install pillow --quiet
          @'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import base64

          transport=Path('src/ananda-approved-logo.b64')
          if not transport.exists(): raise SystemExit('Approved Ananda logo transport missing')
          data=base64.b64decode(''.join(transport.read_text(encoding='utf-8').split()),validate=True)
          src=Path('src/ananda-approved-logo.png');src.write_bytes(data)
          raw=Image.open(src).convert('RGBA');raw.load()
          if raw.size!=(192,192): raise SystemExit('Approved logo dimensions invalid: '+repr(raw.size))
          renderer=raw.resize((128,128),Image.Resampling.LANCZOS)
          renderer.save('src/logo-128.png',optimize=True)

          base=raw.resize((512,512),Image.Resampling.LANCZOS)
          mask=Image.new('L',(512,512),0);ImageDraw.Draw(mask).ellipse((3,3,509,509),fill=255);base.putalpha(mask)
          sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]
          base.save('src/ananda-icon.ico',format='ICO',sizes=sizes)
          ico=Image.open('src/ananda-icon.ico')
          if set(sizes)-set(ico.ico.sizes()): raise SystemExit('Multi-resolution icon is incomplete')

          sidebar_transport=Path('src/installer-sidebar-master.b64')
          if not sidebar_transport.exists(): raise SystemExit('Approved installer sidebar transport missing')
          sidebar_bytes=base64.b64decode(''.join(sidebar_transport.read_text(encoding='utf-8').split()),validate=True)
          sidebar_jpg=Path('src/installer-sidebar-master-decoded.jpg')
          sidebar_jpg.write_bytes(sidebar_bytes)
          side=Image.open(sidebar_jpg).convert('RGB');side.load()
          if side.size!=(164,314): raise SystemExit('Approved sidebar source dimensions invalid: '+repr(side.size))
          side.save('src/installer-sidebar.bmp')
          side.save('src/uninstaller-sidebar.bmp')

          logo=Image.new('RGB',(96,96),'white')
          icon=raw.resize((92,92),Image.Resampling.LANCZOS)
          logo.paste(icon,(2,2),icon if 'A' in icon.getbands() else None)
          logo.save('src/installer-logo.bmp')

          head=Image.new('RGB',(150,57),'white')
          icon45=raw.resize((45,45),Image.Resampling.LANCZOS)
          head.paste(icon45,(6,6),icon45 if 'A' in icon45.getbands() else None)
          hd=ImageDraw.Draw(head)
          try: hf=ImageFont.truetype(r'C:\Windows\Fonts\arialbd.ttf',14)
          except: hf=None
          hd.text((58,19),'ANANDA SANGHA',font=hf,fill=(15,55,116))
          head.save('src/installer-header.bmp')
          print('APPROVED ARTWORK PASS',side.size,logo.size,sorted(ico.ico.sizes()))
          '@ | Set-Content make_approved_art.py -Encoding utf8
          python make_approved_art.py
          if($LASTEXITCODE -ne 0){throw 'Approved artwork generation failed'}
          Remove-Item make_approved_art.py -Force

      - name: Set Beta 5.13 version
        shell: powershell
        run: |
          @'
          import json,pathlib,re
          p=pathlib.Path('src/package.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['version']='2.0.0-beta.5.13'
          p.write_text(json.dumps(d,indent=2)+'\n',encoding='utf-8')
          m=pathlib.Path('src/main.js')
          ms=m.read_text(encoding='utf-8')
          ms=re.sub(r"const APP_VERSION = '[^']+';","const APP_VERSION = '2.0.0-beta.5.13';",ms,count=1)
          m.write_text(ms,encoding='utf-8')
          '@ | Set-Content set_version.py -Encoding utf8
          python set_version.py
          if($LASTEXITCODE -ne 0){throw 'Could not set Beta 5.13 version'}
          Remove-Item set_version.py -Force

      - name: Apply Beta 5.12 Active Classes fix before validation
        shell: powershell
        run: |
          python src/build-beta512-activeclasses.py
          if($LASTEXITCODE -ne 0){throw 'Beta 5.12 active classes patch failed'}
          Select-String -Path src\index.html -Pattern 'p2v512FixActiveClasses' -Quiet | Out-Null
          if(-not $?) {throw 'Active Classes patch missing immediately after apply'}

      - name: Apply Beta 5.13 final corrections and installer
        shell: powershell
        run: |
          @'
          import gzip,pathlib
          pairs=[
            ('src/build-beta513-final.py.gz','src/build-beta513-final.py'),
            ('src/installer513.nsh.gz','src/installer.nsh'),
          ]
          for source,dest in pairs:
              p=pathlib.Path(source)
              if not p.exists(): raise SystemExit('Missing '+source)
              pathlib.Path(dest).write_bytes(gzip.decompress(p.read_bytes()))
          '@ | Set-Content restore_beta513.py -Encoding utf8
          python restore_beta513.py
          if($LASTEXITCODE -ne 0){throw 'Could not restore Beta 5.13 sources'}
          Remove-Item restore_beta513.py -Force
          python src/build-beta513-final.py
          if($LASTEXITCODE -ne 0){throw 'Beta 5.13 final app patch failed'}
          $html=Get-Content src\index.html -Raw
          if($html -notmatch 'PHASE2 BETA513 CURRENT FINAL'){throw 'Beta 5.13 marker missing immediately after apply'}

      - name: Upload generated Beta 5.13 source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: beta513-generated-source
          path: |
            src/index.html
            src/main.js
            src/preload.js
            src/package.json
            src/installer.nsh
            src/build-beta513-final.py
          if-no-files-found: error

      - name: Validate Beta 5.13 source and corrections
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re,json
          html=Path('src/index.html').read_text(encoding='utf-8')
          required=[
            'PHASE2 BETA5 FIX6','PHASE2 BETA56 CHAT FINAL','PHASE2 BETA57 REFINE',
            'PHASE2 BETA58 ATTENDANCE QR','PHASE2 BETA59 ATTENDANCE FINAL',
            'PHASE2 BETA510 CURRENT APPROVED','PHASE2 BETA511 COMPLETE',
            'p2v512FixActiveClasses',"switchPage('activeClasses')",
            'PHASE2 BETA513 CURRENT FINAL','p2v513PermanentMobileIdentityRule',
            'p2v513VipSectionInOutsideList','p2v513-vip-head','P2V513_PRINT',
            'p2v513Geometry','grid-template-columns:9mm minmax(0,1fr) 18mm',
            'classAttendanceHub','classReportsHub','MARK REMAINING ABSENT',
            'p2v510EventLanding','p2v510ClassYear','UPDATE ATTENDANCE',
            'SCAN TO UPLOAD','prepareSheetLink','BATCH WISE','STUDENT WISE'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing Beta 5.13 markers: '+repr(missing))
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S|re.I)
          if not scripts: raise SystemExit('No app scripts found')
          Path('beta513-check.js').write_text('\n'.join(scripts),encoding='utf-8')
          pkg=json.loads(Path('src/package.json').read_text(encoding='utf-8'))
          nsis=pkg['build']['nsis']
          if pkg['version']!='2.0.0-beta.5.13': raise SystemExit('Wrong package version')
          if nsis.get('oneClick') is not False or nsis.get('perMachine') is not True:
              raise SystemExit('Installer must be assisted all-users mode')
          '@ | Set-Content validate_beta513.py -Encoding utf8
          python validate_beta513.py
          if($LASTEXITCODE -ne 0){throw 'Beta 5.13 source marker validation failed'}
          node --check beta513-check.js
          if($LASTEXITCODE -ne 0){throw 'Beta 5.13 renderer JavaScript syntax failed'}
          node --check src/main.js
          if($LASTEXITCODE -ne 0){throw 'main.js syntax failed'}
          node --check src/preload.js
          if($LASTEXITCODE -ne 0){throw 'preload.js syntax failed'}
          $main=Get-Content src\main.js -Raw
          $pre=Get-Content src\preload.js -Raw
          if($main -notmatch 'BETA59 PRINT PREVIEW'){throw 'Print preview missing'}
          if($main -notmatch 'ananda-attendance-prepare-sheet-link'){throw 'Printed QR direct link missing'}
          if($main -notmatch 'BETA511 APPROVED MOBILE LOGO'){throw 'Approved mobile logo missing'}
          if($pre -notmatch 'prepareSheetLink'){throw 'Phone bridge missing'}
          Remove-Item validate_beta513.py,beta513-check.js -Force

      - name: QR round-trip mockup check x5
        shell: powershell
        run: |
          @'
          const QRCode=require('./src/node_modules/qrcode');
          const jsQR=require('./src/node_modules/jsqr');
          function hash(text){let h=2166136261>>>0;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}
          function payload(batchId,date,sheet,totalSheets){const core=[batchId,date,sheet,totalSheets].join('|');return JSON.stringify({v:1,kind:'ANANDA_ATTENDANCE',batchId,date,sheet,totalSheets,sessionId:batchId+':'+date,verify:hash(core)})}
          function renderQr(text){
            const q=QRCode.create(text,{errorCorrectionLevel:'M'}),n=q.modules.size,quiet=4,scale=7,w=(n+quiet*2)*scale,data=new Uint8ClampedArray(w*w*4);data.fill(255);
            for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.modules.get(x,y)){for(let yy=0;yy<scale;yy++)for(let xx=0;xx<scale;xx++){const px=((y+quiet)*scale+yy)*w+((x+quiet)*scale+xx),i=px*4;data[i]=0;data[i+1]=0;data[i+2]=0;data[i+3]=255}}
            return {data,w}
          }
          const cases=[
            ['batch-level1-a','2026-10-03',1,1],
            ['batch-level1-b','2026-10-10',1,2],
            ['batch-level1-b','2026-10-10',2,2],
            ['batch-level2-a','2026-11-01',1,1],
            ['batch-level4-kriya','2026-12-20',1,3]
          ];
          cases.forEach((c,i)=>{const text=payload(...c),img=renderQr(text),out=jsQR(img.data,img.w,img.w,{inversionAttempts:'attemptBoth'});if(!out||out.data!==text)throw new Error('QR mockup round-trip failed at check '+(i+1));const o=JSON.parse(out.data),core=[o.batchId,o.date,o.sheet,o.totalSheets].join('|');if(o.verify!==hash(core)||o.kind!=='ANANDA_ATTENDANCE')throw new Error('QR payload verification failed at check '+(i+1));console.log('QR CHECK '+(i+1)+'/5 PASS',o.batchId,o.date,'sheet',o.sheet+'/'+o.totalSheets)});
          console.log('ALL 5 QR MOCKUP CHECKS PASSED');
          '@ | Set-Content qr_roundtrip_5x.js -Encoding utf8
          node qr_roundtrip_5x.js
          if($LASTEXITCODE -ne 0){throw '5x QR round-trip mockup check failed'}
          Remove-Item qr_roundtrip_5x.js -Force

      - name: Printed QR direct-link round-trip check x5
        shell: powershell
        run: |
          @'
          const QRCode=require('./src/node_modules/qrcode');
          const jsQR=require('./src/node_modules/jsqr');
          const {PNG}=require('./src/node_modules/pngjs');
          function hash(text){let h=2166136261>>>0;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}
          function payload(batchId,date,sheet,totalSheets){const core=[batchId,date,sheet,totalSheets].join('|');return JSON.stringify({v:1,kind:'ANANDA_ATTENDANCE',batchId,date,sheet,totalSheets,sessionId:batchId+':'+date,verify:hash(core)})}
          const cases=[
            ['L1-B1','2026-10-03',1,1,'Level 1','Batch 1'],
            ['L1-B2','2026-10-10',1,2,'Level 1','Batch 2'],
            ['L1-B2','2026-10-10',2,2,'Level 1','Batch 2'],
            ['L2-B1','2026-11-01',1,1,'Level 2','Batch 1'],
            ['L4-B3','2027-03-21',3,3,'Level 4','Batch 3']
          ];
          (async()=>{
            for(let i=0;i<cases.length;i++){
              const [batchId,date,sheet,total,course,batch]=cases[i];
              const meta={payload:payload(batchId,date,sheet,total),course,batch,date,sheet,total};
              const a=Buffer.from(JSON.stringify(meta),'utf8').toString('base64url');
              const url='http://192.168.1.6:8787/?a='+encodeURIComponent(a);
              const pngBuffer=await QRCode.toBuffer(url,{errorCorrectionLevel:'M',margin:1,width:420});
              const png=PNG.sync.read(pngBuffer);
              const hit=jsQR(new Uint8ClampedArray(png.data),png.width,png.height,{inversionAttempts:'attemptBoth'});
              if(!hit||hit.data!==url)throw new Error('Printed direct-link QR failed '+(i+1));
              const decoded=JSON.parse(Buffer.from(new URL(hit.data).searchParams.get('a'),'base64url').toString('utf8'));
              const p=JSON.parse(decoded.payload),core=[p.batchId,p.date,p.sheet,p.totalSheets].join('|');
              if(p.verify!==hash(core)||p.kind!=='ANANDA_ATTENDANCE')throw new Error('Printed QR payload failed '+(i+1));
              console.log('PRINTED QR '+(i+1)+'/5 PASS',course,batch,date,'sheet',sheet+'/'+total);
            }
            console.log('ALL 5 PRINTED QR DIRECT-LINK CHECKS PASSED');
          })().catch(e=>{console.error(e);process.exit(1)});
          '@ | Set-Content printed_qr_5x.js -Encoding utf8
          node printed_qr_5x.js
          if($LASTEXITCODE -ne 0){throw '5x printed direct-link QR check failed'}
          Remove-Item printed_qr_5x.js -Force

      - name: Beta 5.13 identity, VIP and attendance geometry checks
        shell: powershell
        run: |
          @'
          function normName(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ')}
          function conflict(rows,role,id,name,mobile){
            const sameList=rows.find(x=>x.role===role&&x.id!==id&&x.mobile===mobile);
            if(sameList)return 'same-list';
            const cross=rows.find(x=>!(x.role===role&&x.id===id)&&x.mobile===mobile&&normName(x.name)!==normName(name));
            return cross?'different-name':null
          }
          const rows=[
            {role:'Volunteer',id:'v1',name:'Ankit Kohli',mobile:'9810000000'},
            {role:'Acharya',id:'a1',name:'Shashank',mobile:'9999999999'},
            {role:'Attendee',id:'t1',name:'Family Member',mobile:''}
          ];
          const cases=[
            [conflict(rows,'Acharya','new','Ankit Kohli','9810000000'),null,'same person cross-list allowed'],
            [conflict(rows,'Acharya','new','Rahul','9810000000'),'different-name','different name same number blocked'],
            [conflict(rows,'Volunteer','new','Someone','9810000000'),'same-list','same-list duplicate blocked'],
            [conflict(rows,'Kriyaban','new','Shashank','9999999999'),null,'same person another role allowed'],
            [conflict(rows,'Student','new','Different','9999999999'),'different-name','different identity blocked']
          ];
          cases.forEach((c,i)=>{if(c[0]!==c[1])throw new Error('IDENTITY '+(i+1)+' failed '+c[2]);console.log('IDENTITY '+(i+1)+'/5 PASS',c[2])});
          const people=[{name:'Ajay Kia',vip:false},{name:'Dhyana Ji',vip:true},{name:'Rahul Nitin',vip:false}];
          const normal=people.filter(x=>!x.vip),vip=people.filter(x=>x.vip);
          if(normal.some(x=>x.vip)||vip.some(x=>!x.vip)||normal.length!==2||vip.length!==1)throw new Error('VIP split failed');
          console.log('VIP SEPARATE HEADER PASS');
          '@ | Set-Content beta513_rules.js -Encoding utf8
          node beta513_rules.js
          if($LASTEXITCODE -ne 0){throw 'Identity/VIP rule checks failed'}
          Remove-Item beta513_rules.js -Force

          @'
          const DOC={top:70,bottom:265,leftMark:[82,100],rightMark:[183,201],qr:{left:174,top:8,size:27}};
          function geom(count){const rows=Math.max(1,Math.ceil(Math.max(1,count)/2)),avail=DOC.bottom-DOC.top;return{rows,rowHeight:Math.min(30,avail/rows)}}
          function solve8(A,b){const m=A.map((r,i)=>r.slice().concat([b[i]])),n=8;for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(m[r][c])>Math.abs(m[p][c]))p=r;if(Math.abs(m[p][c])<1e-9)return null;[m[c],m[p]]=[m[p],m[c]];let d=m[c][c];for(let j=c;j<=n;j++)m[c][j]/=d;for(let r=0;r<n;r++)if(r!==c){let f=m[r][c];for(let j=c;j<=n;j++)m[r][j]-=f*m[c][j]}}return m.map(r=>r[n])}
          function hom(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const[x,y]=src[i],u=dst[i].x,v=dst[i].y;A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}return[...solve8(A,b),1]}
          function map(h,x,y){const d=h[6]*x+h[7]*y+h[8];return{x:(h[0]*x+h[1]*y+h[2])/d,y:(h[3]*x+h[4]*y+h[5])/d}}
          function inv(h){const[a,b,c,d,e,f,g,j,i]=h,A=e*i-f*j,B=c*j-b*i,C=b*f-c*e,D=f*g-d*i,E=a*i-c*g,F=c*d-a*f,G=d*j-e*g,H2=b*g-a*j,I=a*e-b*d,det=a*A+b*D+c*G;return[A/det,B/det,C/det,D/det,E/det,F/det,G/det,H2/det,I/det]}
          function inkAt(x,y,marks,count){const g=geom(count);for(const m of marks){const row=Math.floor(m/2),col=m%2,top=DOC.top+row*g.rowHeight,[x0,x1]=col?DOC.rightMark:DOC.leftMark,pad=Math.max(1.5,g.rowHeight*.18);if(x>=x0&&x<=x1&&y>=top+pad&&y<=top+g.rowHeight-pad)return true}return false}
          function score(h,x0,y0,x1,y1,marks,count){let ink=0,total=0,ih=inv(h);for(let gy=0;gy<16;gy++)for(let gx=0;gx<22;gx++){let x=x0+(gx+.5)*(x1-x0)/22,y=y0+(gy+.5)*(y1-y0)/16,p=map(h,x,y),doc=map(ih,p.x,p.y);total++;if(inkAt(doc.x,doc.y,marks,count))ink++}return ink/total}
          const src=[[174,8],[201,8],[174,35],[201,35]];
          const cases=[
            {count:10,dst:[{x:830,y:70},{x:1000,y:74},{x:825,y:245},{x:1005,y:250}],marks:[0,1,4,7]},
            {count:20,dst:[{x:760,y:95},{x:955,y:84},{x:775,y:290},{x:972,y:278}],marks:[1,3,8,14,19]},
            {count:40,dst:[{x:900,y:55},{x:1085,y:77},{x:875,y:250},{x:1064,y:272}],marks:[0,19,20,21,39]},
            {count:17,dst:[{x:690,y:130},{x:910,y:100},{x:725,y:350},{x:940,y:315}],marks:[2,6,10,16]},
            {count:33,dst:[{x:810,y:110},{x:1010,y:110},{x:790,y:320},{x:1030,y:315}],marks:[0,9,18,27,32]}
          ];
          cases.forEach((tc,ci)=>{const h=hom(src,tc.dst),g=geom(tc.count),found=[];for(let i=0;i<tc.count;i++){const row=Math.floor(i/2),col=i%2,y=DOC.top+row*g.rowHeight,[x0,x1]=col?DOC.rightMark:DOC.leftMark,pad=Math.max(1.5,g.rowHeight*.18);if(score(h,x0,y+pad,x1,y+g.rowHeight-pad,tc.marks,tc.count)>=.025)found.push(i)}const a=found.join(','),e=tc.marks.join(',');if(a!==e)throw new Error('MARK '+(ci+1)+' failed expected '+e+' got '+a);console.log('MARK '+(ci+1)+'/5 PASS count='+tc.count,a)});
          console.log('ALL 5 ROW-MAJOR MARK-AFTER-NAME CHECKS PASSED');
          '@ | Set-Content beta513_mark_geometry.js -Encoding utf8
          node beta513_mark_geometry.js
          if($LASTEXITCODE -ne 0){throw 'Beta 5.13 mark geometry checks failed'}
          Remove-Item beta513_mark_geometry.js -Force

      - name: Installer visual-flow check 1 of 3
        shell: powershell
        run: |
          $nsh=Get-Content src\installer.nsh -Raw
          $required=@('AnandaWelcomeCreate','Welcome To','Ananda Sangha','AnandaLicenseCreate','License Agreement','AnandaOptionsPageCreate','Choose Install Location','Create a desktop shortcut','Create a Start Menu shortcut','Launch Ananda Sangha after installation','AnandaFinishCreate','Installation completed successfully!','installer-sidebar.bmp','installer-logo.bmp')
          foreach($x in $required){if($nsh -notmatch [regex]::Escape($x)){throw "Installer flow missing: $x"}}
          if($nsh -match 'Anyone who uses this computer'){throw 'Old install-mode screen text must not exist'}
          Write-Host 'INSTALLER CHECK 1/3 PASS - all approved page elements exist'

      - name: Installer visual-flow check 2 of 3
        shell: powershell
        run: |
          @'
          from PIL import Image
          from pathlib import Path
          sidebar=Image.open('src/installer-sidebar.bmp')
          logo=Image.open('src/installer-logo.bmp')
          if sidebar.size!=(164,314): raise SystemExit('Sidebar must be 164x314')
          if logo.size!=(96,96): raise SystemExit('Finish logo must be 96x96')
          if not Path('src/installer-sidebar-master.b64').exists(): raise SystemExit('Approved sidebar master transport missing')
          print('INSTALLER CHECK 2/3 PASS - approved artwork dimensions verified')
          '@ | Set-Content check_installer_art.py -Encoding utf8
          python check_installer_art.py
          if($LASTEXITCODE -ne 0){throw 'Installer artwork check failed'}
          Remove-Item check_installer_art.py -Force

      - name: Installer visual-flow check 3 of 3
        shell: powershell
        run: |
          $pkg=Get-Content src\package.json -Raw | ConvertFrom-Json
          if($pkg.build.nsis.oneClick -ne $false){throw 'Installer is not assisted mode'}
          if($pkg.build.nsis.perMachine -ne $true){throw 'Installer is not all-users mode'}
          if($pkg.build.nsis.allowElevation -ne $true){throw 'Installer elevation setting missing'}
          if($pkg.build.nsis.include -ne 'installer.nsh'){throw 'Custom installer include missing'}
          if($pkg.build.nsis.runAfterFinish -ne $false){throw 'Default finish launcher must be disabled'}
          Write-Host 'INSTALLER CHECK 3/3 PASS - package is wired to the custom flow'

      - name: Build Windows x64 installer
        shell: powershell
        run: |
          Remove-Item src\dist -Recurse -Force -ErrorAction SilentlyContinue
          Push-Location src
          npm run dist
          if($LASTEXITCODE -ne 0){throw 'electron-builder failed'}
          Pop-Location
          $setup='src\dist\Ananda_Sangha_Event_Desk_Phase2_Setup_v2.0.0-beta.5.13.exe'
          if(!(Test-Path $setup)){throw 'Beta 5.13 Setup.exe missing'}

      - name: Verify compiled Beta 5.13 installer
        shell: powershell
        run: |
          $setup='src\dist\Ananda_Sangha_Event_Desk_Phase2_Setup_v2.0.0-beta.5.13.exe'
          if(!(Test-Path $setup)){throw 'Beta 5.13 installer missing'}
          $size=(Get-Item $setup).Length
          if($size -lt 50000000){throw "Installer unexpectedly small: $size"}
          Write-Host "COMPILED INSTALLER PASS - $size bytes"

      - name: Verify packaged QR renderer files
        shell: powershell
        run: |
          Push-Location src
          npx asar list dist\win-unpacked\resources\app.asar | Set-Content asar-files.txt
          $files=Get-Content asar-files.txt
          if(-not ($files -contains '\qrcode-client.js')){throw 'Packaged qrcode-client.js missing from app.asar'}
          if(-not ($files -contains '\jsqr-client.js')){throw 'Packaged jsqr-client.js missing from app.asar'}
          if(-not ($files -contains '\index.html')){throw 'Packaged index.html missing from app.asar'}
          if(-not ($files -contains '\logo-128.png')){throw 'Packaged approved renderer logo missing from app.asar'}
          Remove-Item asar-files.txt -Force
          Pop-Location

      - name: Upload Beta 5.13 installer
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-Beta-5.13-Current-Final-Installer
          path: src/dist/Ananda_Sangha_Event_Desk_Phase2_Setup_v2.0.0-beta.5.13.exe
          if-no-files-found: error
