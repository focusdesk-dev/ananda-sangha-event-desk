          Copy-Item 'src\dist\Ananda_Sangha_Event_Desk_Phase2_Setup_v2.0.0-beta.5.24.exe' 'installer-modern\Payload\InnerInstaller.exe' -Force
          Remove-Item installer-modern\publish -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish installer-modern\AnandaModernInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o installer-modern\publish
          if($LASTEXITCODE -ne 0){throw 'Modern WPF installer build failed'}
          $modern='installer-modern\publish\Ananda_Sangha_Event_Desk_Modern_Setup_v2.0.0-beta.5.24.exe'
          if(!(Test-Path $modern)){throw 'Modern Beta 5.24 installer missing'}
          $size=(Get-Item $modern).Length
          if($size -lt 100000000){throw "Modern installer unexpectedly small: $size"}
          Write-Host "MODERN INSTALLER PASS - $size bytes"

      - name: Verify packaged QR renderer files
        shell: powershell
        run: |
          Push-Location src
          npx asar list dist\win-unpacked\resources\app.asar | Set-Content asar-files.txt
          $files=Get-Content asar-files.txt
          if(-not ($files -contains '\qrcode-client.js')){throw 'Packaged qrcode-client.js missing from app.asar'}
          if(-not ($files -contains '\jsqr-client.js')){throw 'Packaged jsqr-client.js missing from app.asar'}
          if(-not ($files -contains '\index.html')){throw 'Packaged index.html missing from app.asar'}
          if(-not ($files -contains '\logo-128.png')){throw 'Packaged approved renderer logo missing from app.asar'}
          Remove-Item asar-files.txt -Force
          Pop-Location

      - name: Upload Beta 5.24 modern installer
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-Beta-5.24-Exact-Scan-Review-Modern-Installer
          path: installer-modern/publish/Ananda_Sangha_Event_Desk_Modern_Setup_v2.0.0-beta.5.24.exe
          if-no-files-found: error
