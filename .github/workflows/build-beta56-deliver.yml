name: Build Phase 2 Windows Beta 5.8 Attendance QR

on:
  workflow_dispatch:
  push:
    branches: [phase2-beta56-chatbuild]

jobs:
  build-windows-beta58:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild verified beta 4C base
        shell: powershell
        run: |
          @'
          import base64,gzip,pathlib
          source=pathlib.Path('src/build-beta4c-ci.ps1.gz.b64')
          encoded=''.join(source.read_text(encoding='utf-8').split()).rstrip('=')
          encoded+='='*(-len(encoded)%4)
          pathlib.Path('beta4c-ci.ps1').write_bytes(gzip.decompress(base64.b64decode(encoded,validate=False)))
          '@ | Set-Content restore_ci.py -Encoding utf8
          python restore_ci.py
          if($LASTEXITCODE -ne 0){throw 'Could not restore beta 4C CI script'}
          Remove-Item restore_ci.py -Force

          @'
          from pathlib import Path
          p=Path('beta4c-ci.ps1')
          s=p.read_text(encoding='utf-8-sig')
          needle='SILENT INSTALL / OVERWRITE / SHORTCUT / LAUNCH SMOKE TEST'
          pos=s.upper().find(needle)
          if pos < 0: raise SystemExit('Could not locate beta 4C smoke-test section')
          cut=s.rfind('\n',0,pos)+1
          s=s[:cut]+'Write-Host "=== BETA.4C BASE READY FOR BETA.5.8 BUILD ==="\nexit 0\n'
          p.write_text(s,encoding='utf-8')
          '@ | Set-Content trim_beta4c_smoke.py -Encoding utf8
          python trim_beta4c_smoke.py
          if($LASTEXITCODE -ne 0){throw 'Could not trim beta 4C runner-only smoke test'}
          Remove-Item trim_beta4c_smoke.py -Force
          & .\beta4c-ci.ps1
          if($LASTEXITCODE -ne 0){throw 'beta 4C base build failed'}

      - name: Apply beta 5 base page
        shell: powershell
        run: |
          @'
          import base64,gzip,pathlib
          parts=sorted(pathlib.Path('src').glob('build-beta5-batch-page.py.gz.b64.part*'))
          if len(parts)!=4: raise SystemExit(f'Expected 4 beta 5 builder parts, found {len(parts)}')
          encoded=''.join(''.join(p.read_text(encoding='utf-8').split()) for p in parts).rstrip('=')
          encoded+='='*(-len(encoded)%4)
          pathlib.Path('src/build-beta5-batch-page.py').write_bytes(gzip.decompress(base64.b64decode(encoded,validate=False)))
          '@ | Set-Content restore_beta5.py -Encoding utf8
          python restore_beta5.py
          if($LASTEXITCODE -ne 0){throw 'Could not restore beta 5 builder'}
          Remove-Item restore_beta5.py -Force
          python src/build-beta5-batch-page.py
          if($LASTEXITCODE -ne 0){throw 'beta 5 base page patch failed'}

      - name: Apply beta 5.1 through beta 5.6
        shell: powershell
        run: |
          python src/build-beta5-fix1.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.1 failed'}
          python src/build-beta5-fix2.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.2 failed'}
          python src/build-beta5-fix3.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.3 failed'}
          @'
          from pathlib import Path
          p=Path('src/build-beta5-fix4.py')
          s=p.read_text(encoding='utf-8')
          bad="required=['PHASE2 BETA5 FIX4','Student Progress List','Follow-up & Outreach','Annual Class Summary','Admin approval required','All\\',\\'Joined\\',\\'Eligible\\',\\'Not Eligible','export the filtered Batch Report','p2v54NextStatus']"
          good="required=['PHASE2 BETA5 FIX4','Student Progress List','Follow-up & Outreach','Annual Class Summary','Admin approval required','Joined','Eligible','Not Eligible','export the filtered Batch Report','p2v54NextStatus']"
          if bad in s: p.write_text(s.replace(bad,good),encoding='utf-8')
          '@ | Set-Content repair_fix4.py -Encoding utf8
          python repair_fix4.py
          Remove-Item repair_fix4.py -Force
          python src/build-beta5-fix4.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.4 failed'}
          python src/build-beta5-fix5.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.5 failed'}
          python src/build-beta5-fix6.py
          if($LASTEXITCODE -ne 0){throw 'beta 5.6 failed'}

      - name: Apply decisions from 05 Oct 18:42 onward
        shell: powershell
        run: |
          python src/build-beta56-chat.py
          if($LASTEXITCODE -ne 0){throw 'Beta 5.6 chat patch failed'}
          python src/build-beta57-refine.py
          if($LASTEXITCODE -ne 0){throw 'Beta 5.7 refinement failed'}
          python src/build-beta58-attendance-qr.py
          if($LASTEXITCODE -ne 0){throw 'Beta 5.8 attendance QR patch failed'}

      - name: Repair legacy v125 style literal
        shell: powershell
        run: |
          @'
          from pathlib import Path
          p=Path('src/index.html')
          s=p.read_text(encoding='utf-8')
          prefix="document.head.insertAdjacentHTML('beforeend','"
          start=s.find(prefix+"<style>.v125-keyhint")
          if start < 0: raise SystemExit('Legacy v125 style block not found')
          content_start=start+len(prefix)
          close=s.find("</style>');",content_start)
          if close < 0: raise SystemExit('Legacy v125 style block end not found')
          content_end=close+len('</style>')
          inner=s[content_start:content_end]
          inner=inner.replace('`','\\`').replace('${','\\${')
          fixed="document.head.insertAdjacentHTML('beforeend',`"+inner+"`);"
          end=close+len("</style>');")
          p.write_text(s[:start]+fixed+s[end:],encoding='utf-8')
          print('Legacy v125 style block converted to a template literal')
          '@ | Set-Content repair_legacy_js.py -Encoding utf8
          python repair_legacy_js.py
          if($LASTEXITCODE -ne 0){throw 'Legacy JS repair failed'}
          Remove-Item repair_legacy_js.py -Force

      - name: Install offline QR libraries
        shell: powershell
        run: |
          Push-Location src
          npm install qrcode@1.5.4 jsqr@1.4.0 browserify@17.0.1 --save-dev --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Could not install offline QR libraries'}
          @'
          module.exports = require('qrcode');
          '@ | Set-Content qrcode-entry.js -Encoding utf8
          @'
          module.exports = require('jsqr');
          '@ | Set-Content jsqr-entry.js -Encoding utf8
          npx browserify qrcode-entry.js --standalone QRCode -o qrcode-client.js
          if($LASTEXITCODE -ne 0 -or !(Test-Path 'qrcode-client.js')){throw 'Could not bundle QRCode for offline renderer'}
          npx browserify jsqr-entry.js --standalone jsQR -o jsqr-client.js
          if($LASTEXITCODE -ne 0 -or !(Test-Path 'jsqr-client.js')){throw 'Could not bundle jsQR for offline renderer'}
          Remove-Item qrcode-entry.js,jsqr-entry.js -Force
          Pop-Location

      - name: Set beta 5.8 version
        shell: powershell
        run: |
          @'
          import json,pathlib
          p=pathlib.Path('src/package.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['version']='2.0.0-beta.5.8'
          p.write_text(json.dumps(d,indent=2)+'\n',encoding='utf-8')
          '@ | Set-Content set_version.py -Encoding utf8
          python set_version.py
          if($LASTEXITCODE -ne 0){throw 'Could not set beta 5.8 version'}
          Remove-Item set_version.py -Force

      - name: Validate beta 5.8 source
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re
          html=Path('src/index.html').read_text(encoding='utf-8')
          required=['PHASE2 BETA5 FIX6','PHASE2 BETA56 CHAT FINAL','PHASE2 BETA57 REFINE','PHASE2 BETA58 ATTENDANCE QR','classAttendanceHub','PRINT QR ATTENDANCE SHEET','SCAN / UPLOAD ATTENDANCE SHEET','p2v58Payload','p2v58ParsePayload','Class, batch and date selected automatically','BATCH WISE','STUDENT WISE','Double-click a class card to open its batch.']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing beta 5.8 markers: '+repr(missing))
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S|re.I)
          if not scripts: raise SystemExit('No app scripts found')
          Path('beta58-check.js').write_text('\n'.join(scripts),encoding='utf-8')
          '@ | Set-Content validate_beta58.py -Encoding utf8
          python validate_beta58.py
          if($LASTEXITCODE -ne 0){throw 'Source marker validation failed'}
          node --check beta58-check.js
          if($LASTEXITCODE -ne 0){throw 'Index JavaScript syntax failed'}
          node --check src/main.js
          if($LASTEXITCODE -ne 0){throw 'main.js syntax failed'}
          node --check src/preload.js
          if($LASTEXITCODE -ne 0){throw 'preload.js syntax failed'}
          if(!(Test-Path src\\qrcode-client.js)){throw 'qrcode-client.js missing'}
          if(!(Test-Path src\\jsqr-client.js)){throw 'jsqr-client.js missing'}
          Remove-Item validate_beta58.py,beta58-check.js -Force

      - name: QR round-trip mockup check x5
        shell: powershell
        run: |
          @'
          const QRCode=require('./src/node_modules/qrcode');
          const jsQR=require('./src/node_modules/jsqr');
          function hash(text){let h=2166136261>>>0;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}
          function payload(batchId,date,sheet,totalSheets){const core=[batchId,date,sheet,totalSheets].join('|');return JSON.stringify({v:1,kind:'ANANDA_ATTENDANCE',batchId,date,sheet,totalSheets,sessionId:batchId+':'+date,verify:hash(core)})}
          function renderQr(text){
            const q=QRCode.create(text,{errorCorrectionLevel:'M'}),n=q.modules.size,quiet=4,scale=7,w=(n+quiet*2)*scale,data=new Uint8ClampedArray(w*w*4);data.fill(255);
            for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.modules.get(x,y)){for(let yy=0;yy<scale;yy++)for(let xx=0;xx<scale;xx++){const px=((y+quiet)*scale+yy)*w+((x+quiet)*scale+xx),i=px*4;data[i]=0;data[i+1]=0;data[i+2]=0;data[i+3]=255}}
            return {data,w}
          }
          const cases=[
            ['batch-level1-a','2026-10-03',1,1],
            ['batch-level1-b','2026-10-10',1,2],
            ['batch-level1-b','2026-10-10',2,2],
            ['batch-level2-a','2026-11-01',1,1],
            ['batch-level4-kriya','2026-12-20',1,3]
          ];
          cases.forEach((c,i)=>{const text=payload(...c),img=renderQr(text),out=jsQR(img.data,img.w,img.w,{inversionAttempts:'attemptBoth'});if(!out||out.data!==text)throw new Error('QR mockup round-trip failed at check '+(i+1));const o=JSON.parse(out.data),core=[o.batchId,o.date,o.sheet,o.totalSheets].join('|');if(o.verify!==hash(core)||o.kind!=='ANANDA_ATTENDANCE')throw new Error('QR payload verification failed at check '+(i+1));console.log('QR CHECK '+(i+1)+'/5 PASS',o.batchId,o.date,'sheet',o.sheet+'/'+o.totalSheets)});
          console.log('ALL 5 QR MOCKUP CHECKS PASSED');
          '@ | Set-Content qr_roundtrip_5x.js -Encoding utf8
          node qr_roundtrip_5x.js
          if($LASTEXITCODE -ne 0){throw '5x QR round-trip mockup check failed'}
          Remove-Item qr_roundtrip_5x.js -Force

      - name: Build Windows x64 installer
        shell: powershell
        run: |
          Remove-Item src\dist -Recurse -Force -ErrorAction SilentlyContinue
          Push-Location src
          npm run dist
          if($LASTEXITCODE -ne 0){throw 'electron-builder failed'}
          Pop-Location
          $setup='src\dist\Ananda_Sangha_Event_Desk_Phase2_Setup_v2.0.0-beta.5.8.exe'
          if(!(Test-Path $setup)){throw 'Beta 5.8 Setup.exe missing'}

      - name: Upload Beta 5.8 installer
        uses: actions/upload-artifact@v4
        with:
          name: Ananda-Sangha-Event-Desk-Beta-5.8-Attendance-QR-Installer
          path: src/dist/Ananda_Sangha_Event_Desk_Phase2_Setup_v2.0.0-beta.5.8.exe
          if-no-files-found: error
